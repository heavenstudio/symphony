<title>Timeline navigation mockup</title>
<style>
/* A design mockup of a task's timeline, drawn from one task's recorded timeline (embedded below).
   It reads and writes nothing; its controls change only this page. Tokens are the client's
   (apps/symphony-web/src/styles/board.css). */
:root { --background:#fbfaf7; --foreground:#1d1c1a; --muted-foreground:#6b6862; --border:#e4e0d8; --primary:#2f5d9e;
  --like:#2e7d4f; --dislike:#b3392b; --question:#946a00; --decision:#4a3f9e; --resolved:#5f6b73; --auto:#1f7a8c;
  --card:#ffffff; --muted:rgba(127,127,127,.07);
  --font-sans:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --fs-xs:.75rem; --fs-sm:.875rem; }
@media (prefers-color-scheme: dark) {
  :root { --background:#161513; --foreground:#e8e4dc; --muted-foreground:#a19c93; --border:#2c2a26; --primary:#7fa7e0;
    --like:#6fc48f; --dislike:#e57a6a; --question:#e0b84c; --decision:#a89ce8; --resolved:#8f9aa3; --auto:#5cc4d6;
    --card:#1d1c19; --muted:rgba(255,255,255,.04); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 15px/1.45 var(--font-sans); }
main { max-width: 1440px; margin: 0 auto; padding: 16px 24px 32px; }
h2 { font-size: 1.6rem; margin: 8px 0 12px; }
.mock-note { margin: 0 0 12px; color: var(--muted-foreground); font-size: var(--fs-xs); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 24px 16px; }
.totals { margin: 0 0 10px; color: var(--muted-foreground); font-size: var(--fs-sm); }
.muted { color: var(--muted-foreground); }

/* The toolbar: the view, its zoom, what it shows and the quiet stretches' switch. */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; font-size: var(--fs-sm); }
.group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.group button { font: inherit; color: inherit; background: transparent; border: 0; padding: 4px 12px; cursor: pointer; }
.group button + button { border-left: 1px solid var(--border); }
.group button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); font-weight: 600; }
.range { font-variant-numeric: tabular-nums; }
.skip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.skip input { accent-color: var(--primary); margin: 0; }
.hint { margin-left: auto; color: var(--muted-foreground); font-size: var(--fs-xs); }

/* The overview: the whole task, the window shown on it. */
.overview { position: relative; height: 30px; margin: 0 var(--end) 6px var(--name); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--muted); }
.overview .ov-stage { position: absolute; top: 4px; height: 7px; border-radius: 2px; background: color-mix(in srgb, var(--c) 55%, transparent); }
.overview .ov-run { position: absolute; top: 15px; height: 10px; width: 1px; background: color-mix(in srgb, var(--c) 80%, transparent); }
.overview .ov-dim { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--background) 62%, transparent); }
.overview .ov-win { position: absolute; top: 0; bottom: 0; border: 2px solid var(--primary); border-radius: 4px; }
.overview .ov-brk { position: absolute; top: 0; bottom: 0; width: 6px; background: var(--card); border-left: 1px dashed var(--muted-foreground); border-right: 1px dashed var(--muted-foreground); }

/* The lanes: a name column, then a track per lane on one scale. */
.lanes { --name: 152px; --end: 88px; position: relative; }
.axis { position: relative; height: 22px; margin: 0 var(--end) 0 var(--name); }
.tick-label { position: absolute; top: 0; transform: translateX(-50%); color: var(--muted-foreground); font-size: var(--fs-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tick-label.day { color: var(--foreground); font-weight: 600; }
.hours { position: absolute; left: var(--name); right: var(--end); top: 22px; bottom: 0; pointer-events: none; }
.hour { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--border); }
.lane { display: flex; border-bottom: 1px solid var(--border); position: relative; }
.lane .name { flex: 0 0 var(--name); padding-right: 8px; display: flex; flex-direction: column; justify-content: center; font-size: var(--fs-sm); min-width: 0; }
.lane .name b { font-weight: 600; }
.lane .name small { color: var(--muted-foreground); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; flex: 1; margin-right: var(--end); min-width: 0; }
.seg { position: absolute; box-sizing: border-box; min-width: 2px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, transparent);
  color: var(--c); font-size: var(--fs-xs); font-weight: 600; }
.seg.hold { border-style: dashed; background: color-mix(in srgb, var(--c) 6%, transparent); color: var(--muted-foreground); }
.after { position: absolute; font-size: var(--fs-xs); font-weight: 600; color: var(--c); white-space: nowrap; }
.run { position: absolute; height: 14px; border-radius: 2px; background: color-mix(in srgb, var(--c) 70%, transparent); outline: 1px solid var(--card);
  color: var(--card); font-size: 10.5px; font-weight: 600; line-height: 14px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
@media (prefers-color-scheme: dark) { .run { color: #10100e; } }
.notkept { position: absolute; top: 0; bottom: 0; border-right: 1px dashed var(--muted-foreground);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted-foreground) 22%, transparent) 0 2px, transparent 2px 7px); }
.notkept span { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: var(--fs-xs); color: var(--muted-foreground); background: var(--card); padding: 0 4px; white-space: nowrap; }
.rail { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dotted color-mix(in srgb, var(--muted-foreground) 45%, transparent); }
.mark { position: absolute; width: 2px; height: 8px; margin-left: -1px; background: color-mix(in srgb, var(--muted-foreground) 85%, transparent); border-radius: 1px; }
.mark.sel { width: 3px; margin-left: -1.5px; background: var(--foreground); }
.gate { display: flex; height: 18px; }
.gate .name { flex: 0 0 var(--name); padding-left: 10px; color: var(--muted-foreground); font-size: var(--fs-xs); line-height: 18px; }
.gate .track { height: 18px; }
.g { position: absolute; top: 7px; height: 0; border-top: 4px solid var(--c); }
.g.missing { border-top-style: dotted; }
.brk { position: absolute; top: 0; bottom: 0; background: var(--card); z-index: 2; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.brk svg { position: absolute; top: 0; height: 100%; width: 6px; }
.brk .brk-l { left: -3px; } .brk .brk-r { right: -3px; }
.brk span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: var(--fs-xs); color: var(--muted-foreground); white-space: nowrap; }
.axis .brk-label { position: absolute; top: 0; transform: translateX(-50%); font-size: var(--fs-xs); font-weight: 600; color: var(--foreground); white-space: nowrap; background: var(--card); padding: 0 4px; }
svg.arrows { position: absolute; left: var(--name); top: 0; pointer-events: none; z-index: 3; overflow: visible; }
.guide { position: absolute; z-index: 3; border-left: 1px dashed var(--foreground); opacity: .55; }
.chip { position: absolute; z-index: 4; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: var(--fs-xs); white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; padding: 0; margin: 12px 0 0; color: var(--muted-foreground); font-size: var(--fs-xs); }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.details { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; font-size: var(--fs-sm); }
.details h3 { font-size: var(--fs-sm); margin: 0 0 4px; }
.details p { margin: 2px 0; }

/* A phone: the list, a row per step, in the 240 px box until Show all. */
.phone main { padding: 8px 16px 24px; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { display: grid; grid-template-columns: 52px 18px 1fr auto; align-items: center; column-gap: 6px; min-height: 28px; font-size: 14px; }
.plist .t { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
.plist .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); justify-self: center; }
.plist .dia { width: 8px; height: 8px; border: 1.5px solid var(--muted-foreground); transform: rotate(45deg); justify-self: center; }
.plist .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .msg .lbl { color: var(--muted-foreground); font-size: 13px; }
.plist .len { font-weight: 600; font-variant-numeric: tabular-nums; }
.plist .stage { min-height: 44px; font-weight: 600; font-size: 15px; }
.plist .stage .pbar { grid-column: 3 / 5; height: 7px; border-radius: 3px; background: var(--c); margin-top: -6px; }
.plist .day { font-weight: 700; font-size: 13px; min-height: 24px; }
.plist .red { color: var(--dislike); font-weight: 600; }
.plist .quiet { grid-template-columns: 1fr; margin: 6px 0; padding: 8px 10px; border: 1px dashed var(--muted-foreground); border-radius: 8px; background: var(--muted); }
.plist .quiet b { display: block; font-size: 14px; }
.plist .quiet small { color: var(--muted-foreground); font-size: 12px; }
.plist .kept .lbl { color: var(--muted-foreground); font-size: 13px; }
.plist .kept .sw { width: 14px; height: 10px; justify-self: center; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted-foreground) 45%, transparent) 0 2px, transparent 2px 5px); border: 1px dashed var(--muted-foreground); }
.pbox { height: 240px; display: flex; flex-direction: column; }
.pbox .pclip { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28px); mask-image: linear-gradient(to bottom, transparent, #000 28px); }
.pfoot { display: flex; align-items: center; gap: 10px; padding-top: 8px; font-size: var(--fs-xs); color: var(--muted-foreground); }
.pfoot button { margin-left: auto; font: inherit; font-size: 14px; color: var(--foreground); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
.phone .panel { padding: 14px 14px 12px; }
.phone .totals { font-size: 14px; margin-bottom: 6px; }
</style>

  const out = [];
  let lastDay = null;
  for (const r of rows) {
    const d = day(r.t);
    if (d !== lastDay) { out.push(`<li class="day"><span class="t">${d}</span></li>`); lastDay = d; }
    out.push(r.html);
  }
  const machine = runs.reduce((n, r) => n + ((r.ended ?? END) - (r.started ?? r.queued)), 0);
  const head = `<p class="totals">${took(END - START)} in all · ${rounds.length} review rounds · ${DATA.bounces} bounces<br>Machine ${took(machine)}, queued 0 m</p>`;
  const foot = `<div class="pfoot"><span><i style="display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--primary);vertical-align:middle"></i> worked or ran</span>${view.all ? "" : `<button>Show all</button>`}</div>`;
  const list = `<ul class="plist">${out.join("")}</ul>`;
  document.getElementById("app").innerHTML = `<h2>Timeline</h2><p class="mock-note">Mockup from ${DATA.slug}'s recorded timeline. It reads and writes nothing.</p><section class="panel">${view.all ? head + list + foot : `<div class="pbox">${head}<div class="pclip">${list}</div>${foot}</div>`}</section>`;
}

// ---- Controls (this page only) and presets ------------------------------------------------------
const PRESETS = {
  fit: { from: START, to: END, skip: true, sel: null },
  "fit-true": { from: START, to: END, skip: false, sel: null },
  // Option A: the true clock always, no switch.
  "fit-clock": { from: START, to: END, skip: false, sel: null, clock: true },
  "fit-selected": { from: START, to: END, skip: true, sel: 15266 },
  zoom: { from: 1795082700, to: 1795087080, skip: true, sel: 15396 },
};
let view;
function render() { if (view.phone) phone(view); else wide(view); }
function wire(v) {
  const app = document.getElementById("app");
  app.querySelectorAll("[data-act]").forEach((el) => el.addEventListener(el.type === "checkbox" ? "change" : "click", () => {
    const act = el.dataset.act, mid = (v.from + v.to) / 2, half = (v.to - v.from) / 2;
    if (act === "fit") Object.assign(v, { from: START, to: END });
    if (act === "in") Object.assign(v, { from: mid - half / 2, to: mid + half / 2 });
    if (act === "out") Object.assign(v, { from: Math.max(START, mid - half * 2), to: Math.min(END, mid + half * 2) });
    if (act === "skip") v.skip = el.checked;
    render();
  }));
  app.querySelectorAll(".brk").forEach((el) => el.addEventListener("click", () => { v.open.add(Number(el.dataset.open)); render(); }));
  app.querySelectorAll(".mark").forEach((el) => el.addEventListener("click", () => { const id = Number(el.title.slice(1).split(" ")[0]); v.sel = id; render(); }));
  app.onwheel = (e) => {
    if (!(e.ctrlKey || e.metaKey || e.shiftKey)) return;
    e.preventDefault();
    const span = v.to - v.from;
    if (e.shiftKey) { const d = (e.deltaX || e.deltaY) / 1000 * span; v.from = Math.max(START, v.from + d); v.to = Math.min(END, v.from + span); }
    else { const f = e.deltaY > 0 ? 1.25 : 0.8, mid = (v.from + v.to) / 2; v.from = Math.max(START, mid - span * f / 2); v.to = Math.min(END, mid + span * f / 2); }
    render();
  };
}
function start() {
  const key = location.hash.slice(1) || (innerWidth < 900 ? "phone" : "fit");
  if (key.startsWith("phone")) view = { phone: true, all: key === "phone-all" };
  else view = { ...(PRESETS[key] ?? PRESETS.fit), open: new Set() };
  render();
}
addEventListener("hashchange", start);
addEventListener("resize", () => { if (!view.phone) render(); });
start();
</script>
