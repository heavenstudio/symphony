<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board A: a stuck lane</title>
<link rel="stylesheet" href="board-mock.css">
<style>
/* A: today's board, with the blocked column lifted into a lane on top, grouped by who it waits on.
   The pipeline below keeps its columns and its sideways scroll. */
.lane { border:1px solid var(--border); border-top:3px solid var(--dislike); border-radius:var(--r-lg); background:color-mix(in srgb,var(--dislike) 4%,var(--card)); padding:8px 10px 4px; margin:0 0 14px; }
.lane > h2 { font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--dislike); margin:2px 2px 8px; }
.lane > h2 span { color:var(--muted-foreground); letter-spacing:0; text-transform:none; font-weight:600; margin-left:6px; }
.groups { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.group h3 { font-size:var(--fs-sm); margin:0 2px 6px; display:flex; gap:6px; align-items:baseline; }
.group h3 i { font-style:normal; color:var(--k); }
.group h3 .n { color:var(--muted-foreground); font-weight:600; }
.scroll { overflow:hidden; }
.pipeline { display:flex; gap:12px; width:max-content; align-items:flex-start; }
.pipeline > .col { flex:0 0 288px; width:288px; }
.pipeline > .rail { flex:0 0 auto; }
.offline { display:flex; gap:12px; margin-top:12px; }
.offline .col { flex:1 1 240px; }
@media (max-width:760px) {
  .groups { grid-template-columns:minmax(0,1fr); gap:8px; }
  .pipeline > .col { flex-basis:280px; width:280px; }
}
</style>
</head>
<body>
<div id="page"></div>
<script src="sf-board.js"></script>
<script src="board-mock.js"></script>
<script>
const M = window.Mock, B = M.B;
const phone = matchMedia("(max-width:760px)").matches;
const blocked = B.tasks.filter((t) => t.s === "blocked");
// The lane names what each group is blocked on; parked work is blocked on purpose.
const LANE = { you: "Blocked on you", nobody: "Blocked on nobody", check: "Blocked on the nightly", task: "Blocked on other tasks", parked: "Parked" };
const lane = ["you", "nobody", "check", "task", "parked"].map((k) => {
  const rows = blocked.filter((t) => M.kind(t) === k).sort(M.byAge);
  const label = LANE[k];
  const cap = phone ? 2 : 3;
  return `<div class="group k-${k}"><h3><i>●</i>${label} <span class="n">${rows.length}</span></h3>${rows.slice(0, cap).map((t) => M.card(t)).join("")}${rows.length > cap ? `<a class="more" href="#">+${rows.length - cap} more</a>` : ""}</div>`;
}).join("");
const column = (s, extra = "") => {
  const rows = B.tasks.filter((t) => t.s === s).sort(s === "done" ? (a, b) => a.h - b.h : M.byPrio);
  return `<section class="col" data-s="${s}"><h2>${M.NAME[s]} <span class="n">${rows.length}</span></h2>${rows.slice(0, 8).map((t) => M.card(t)).join("")}${rows.length > 8 ? `<a class="more" href="#">+${rows.length - 8} more</a>` : ""}</section>`;
};
document.getElementById("page").innerHTML = `${M.header()}<main>${M.head()}${M.banner()}
<section class="lane"><h2>Blocked <span>${blocked.length}, by what lifts them, oldest first</span></h2><div class="groups">${lane}</div></section>
<div class="scroll fade"><div class="pipeline">${["concept", "design", "ready", "in_progress"].map((s) => column(s)).join("")}<div class="rail">build · test</div>${["review", "done"].map((s) => column(s)).join("")}</div></div>
<div class="offline"><section class="col" data-s="backlog"><h2>Backlog <span class="n">${B.counts.backlog}</span></h2></section><section class="col" data-s="cancelled"><h2>Cancelled <span class="n">${B.counts.cancelled}</span></h2></section></div>
</main>`;
</script>
</body>
</html>
