<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board C: who acts next</title>
<link rel="stylesheet" href="board-mock.css">
<style>
/* C: no columns. The open work is one list grouped by who has to act next, oldest first; the
   pipeline is a strip of counts on top that filters the list. */
.flow { display:flex; height:30px; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--border); margin:0 0 6px; font-size:.75rem; font-weight:650; }
.flow a { --c:var(--muted-foreground); display:flex; align-items:center; gap:5px; padding:0 8px; flex-basis:0; min-width:max-content; white-space:nowrap; overflow:hidden; background:color-mix(in srgb,var(--c) 22%,var(--card)); border-right:1px solid var(--background); }
.flow a i { font-style:normal; color:var(--muted-foreground); }
.flow [data-s=concept], .flow [data-s=design] { --c:var(--decision); } .flow [data-s=ready] { --c:var(--auto); }
.flow [data-s=in_progress] { --c:var(--primary); } .flow [data-s=review] { --c:var(--question); } .flow [data-s=blocked] { --c:var(--dislike); }
.flowkey { font-size:.72rem; color:var(--muted-foreground); margin:0 0 14px; }
.grp { margin:0 0 14px; }
.grp > h2 { font-size:var(--fs-sm); margin:0 0 4px; display:flex; gap:8px; align-items:baseline; padding:0 4px; }
.grp > h2 i { font-style:normal; color:var(--k); }
.grp > h2 .n { color:var(--muted-foreground); font-weight:600; }
.grp > h2 .old { margin-left:auto; color:var(--muted-foreground); font-weight:500; font-size:.78rem; }
.rows { border:1px solid var(--border); border-left:3px solid var(--k); border-radius:var(--r-md); background:var(--card); }
.row { display:grid; grid-template-columns:minmax(0,2.4fr) 150px minmax(0,2fr) 56px; gap:12px; align-items:center; padding:6px 10px; font-size:var(--fs-sm); line-height:1.35; }
.row + .row { border-top:1px solid var(--border); }
.row .tt { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .sl { display:block; color:var(--muted-foreground); font-family:var(--font-mono); font-size:.72rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .why { color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .why b { color:var(--k); font-weight:650; }
.st { justify-self:start; font-size:.7rem; font-weight:650; padding:0 8px; border-radius:var(--r-pill); color:var(--c); background:color-mix(in srgb,var(--c) 12%,transparent); border:1px solid color-mix(in srgb,var(--c) 35%,transparent); white-space:nowrap; }
.st[data-s=concept], .st[data-s=design] { --c:var(--decision); } .st[data-s=ready] { --c:var(--auto); } .st[data-s=in_progress] { --c:var(--primary); }
.st[data-s=review] { --c:var(--question); } .st[data-s=blocked] { --c:var(--dislike); }
.dur { justify-self:end; }
.dur b { font-variant-numeric:tabular-nums; font-size:.8rem; }
.dur b.old { color:var(--dislike); }
.p0 .tt::before { content:"p0 "; color:var(--dislike); font-size:.72rem; } .p1 .tt::before { content:"p1 "; color:var(--question); font-size:.72rem; }
.k-queued .row .tt, .k-parked .row .tt { font-weight:550; color:var(--muted-foreground); }
.grp .more { padding:6px 10px; }
.flowlist { display:none; }
@media (max-width:760px) {
  .flow { height:10px; margin-bottom:8px; } .flow a { font-size:0; padding:0; min-width:0; }
  .flowlist { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.78rem; font-weight:650; margin:0 0 4px; }
  .flowlist span { --c:var(--muted-foreground); } .flowlist span::before { content:"■ "; color:var(--c); }
  .flowlist span i { font-style:normal; color:var(--muted-foreground); }
  .flowlist [data-s=concept], .flowlist [data-s=design] { --c:var(--decision); } .flowlist [data-s=ready] { --c:var(--auto); }
  .flowlist [data-s=in_progress] { --c:var(--primary); } .flowlist [data-s=review] { --c:var(--question); } .flowlist [data-s=blocked] { --c:var(--dislike); }
  .row { grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"t d" "w w"; gap:2px 8px; padding:7px 10px; }
  .row > div:first-child { grid-area:t; } .row .dur { grid-area:d; }
  .row .wcell { grid-area:w; display:flex; gap:6px; align-items:center; min-width:0; }
  .row > .st { display:none; }
  .row .tt { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
}
@media (min-width:761px) { .row .wcell .st { display:none; } }
</style>
</head>
<body>
<div id="page"></div>
<script src="board-data.js"></script>
<script src="board-mock.js"></script>
<script>
const M = window.Mock, B = M.B;
const phone = matchMedia("(max-width:760px)").matches;
const C = B.counts;
const flowStages = [["concept", C.concept], ["design", C.design], ["ready", C.ready], ["in_progress", C.in_progress], ["review", C.review], ["blocked", C.blocked]];
const total = flowStages.reduce((n, [, c]) => n + c, 0);
const flow = `<div class="flow">${flowStages.map(([s, n]) => `<a data-s="${s}" style="flex:${Math.max(n, 4)}">${M.NAME[s]} <i>${n}</i></a>`).join("")}</div><div class="flowlist">${flowStages.map(([s, n]) => `<span data-s="${s}">${M.NAME[s]} <i>${n}</i></span>`).join("")}</div><div class="flowkey">${total} open · ${C.done} done and ${C.cancelled} cancelled today · ${C.backlog} more in backlog</div>`;
const row = (t) => {
  const w = M.why(t);
  const st = `<span class="st" data-s="${t.s}">${M.NAME[t.s]}${t.rounds ? ` · ${t.rounds} review${t.rounds > 1 ? "s" : ""}` : ""}</span>`;
  return `<a class="row p${t.p}"><div><div class="tt">${M.esc(t.title)}</div><span class="sl">${M.esc(t.slug)}</span></div>${st}<div class="wcell">${st}<span class="why">${["task", "agent"].includes(t.w.k) ? `<b>${M.esc(t.w.who)}</b> · ` : ""}${M.esc(w)}</span></div><div class="dur"><b class="${t.h >= M.OLD && !["queued", "parked"].includes(t.w.k) ? "old" : ""}">${M.age(t.h)}</b></div></a>`;
};
const order = M.GROUPS.map((g) => g.k);
const caps = phone ? { you: 4, nobody: 3, check: 2, task: 2, agent: 1, working: 2, queued: 2, parked: 2 } : { you: 5, nobody: 4, check: 3, task: 3, agent: 1, working: 2, queued: 3, parked: 2 };
const groups = order.map((k) => {
  const rows = M.open.filter((t) => M.kind(t) === k).sort(M.byAge);
  const g = M.GROUPS.find((x) => x.k === k);
  const old = rows.length ? `oldest ${M.age(rows[0].h)}` : "";
  return `<section class="grp k-${k}"><h2><i>●</i>${g.label} <span class="n">${rows.length}</span><span class="old">${k === "working" ? "" : old}</span></h2><div class="rows">${rows.slice(0, caps[k]).map(row).join("")}${rows.length > caps[k] ? `<a class="more" href="#">+${rows.length - caps[k]} more</a>` : ""}</div></section>`;
}).join("");
document.getElementById("page").innerHTML = `${M.header()}<main>${M.head()}${flow}${M.banner()}${groups}</main>${M.fab()}`;
</script>
</body>
</html>
