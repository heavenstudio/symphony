s":"done","p":0,"h":10},{"slug":"tools/orchestrator-block-followup","title":"Executors escalate blocks and orchestrators own their resolution","s":"done","p":1,"h":11},{"slug":"tools/orchestrator-low-volume","title":"Warn orchestrators when open parent-task volume falls below four","s":"done","p":1,"h":11},{"slug":"tests/main-red-c64e3c3ea977","title":"Main red: lint-rs/rust-baseline","s":"done","p":0,"h":18},{"slug":"tests/main-red-cdfc50ff83f4","title":"Main red: rust/gate-review/lib/gate_review, rust/symphony-board/test/store","s":"done","p":0,"h":19},{"slug":"tools/review-mirror-by-branch","title":"A review mirror shares the slot of the task whose branch it reviews, not only of the task whose slug is that branch","s":"done","p":1,"h":19},{"slug":"tools/studio/machine-work-stages","title":"Show build and test phases with per-machine WIP guidance","s":"done","p":1,"h":23},{"slug":"tools/unanswered-counts-subtask-answer","title":"A post answered on the instruction subtask it points to, or by the recipient's verdict there, is answered","s":"done","p":1,"h":23},{"slug":"tools/restore-resumed-working","title":"Restoring a Codex reviewer whose resumed conversation reads as working gives it its message, not a dead pane","s":"done","p":1,"h":23}]};
</script>
<script>
// The drawing the board mock-ups share: one card, one "waits on" line, the counts, the banner, and
// today's header, filters and buttons. Each page (a-stuck-lane.html, b-stuck-in-place.html,
// c-who-acts-next.html) carries the same copy of it and of the board above, and lays them out its own way.
(function () {
  const B = window.BOARD;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const age = (h) => (h < 48 ? `${h} h` : `${Math.round(h / 24)} d`);
  const OLD = 7 * 24; // a week or more is drawn in red
  const STAGES = ["concept", "design", "ready", "in_progress", "review", "done"];
  const NAME = { backlog: "Backlog", concept: "Concept", design: "Design", ready: "Ready", in_progress: "In progress", review: "Review", done: "Done", blocked: "Blocked", cancelled: "Cancelled" };
  const kind = (t) => (t.s === "done" ? "done" : t.w ? t.w.k : "nobody");
  // Who the line names, in the words the card uses. A stale session is there, marked stale.
  const on = (t) => {
    const w = t.w;
    if (!w) return "Done";
    return { working: "Working", you: "On you", nobody: "On nobody", queued: "Queued", parked: "Parked" }[w.k] ?? `On ${w.who}`;
  };
  const why = (t) => {
    const w = t.w;
    if (!w) return "";
    if (w.k === "working") return `${w.why} ${w.who}`;
    if (w.k === "parked") return w.why.replace(/^parked:? ?/, "");
    return w.why;
  };
  const open = B.tasks.filter((t) => t.s !== "done");
  const byAge = (a, b) => b.h - a.h || a.p - b.p;
  const byPrio = (a, b) => a.p - b.p || b.h - a.h;
  const muted = (t) => ["queued", "parked", "done"].includes(kind(t));
  // The line every option draws under a card's title.
  const waitLine = (t) => `<div class="wait"><span class="on">${esc(on(t))}</span><span class="why">${esc(why(t))}</span><span class="age${t.h >= OLD && !muted(t) ? " old" : ""}">${t.s === "done" ? "today" : age(t.h)}</span></div>`;
  const reviews = (t) => (t.rounds ? `<span class="tag rounds">${t.rounds} review${t.rounds > 1 ? "s" : ""}</span>` : "");
  const card = (t, o = {}) => {
    const blocked = o.blockedTag && t.s === "blocked";
    const tags = (blocked ? `<span class="tag blocked">blocked</span>` : "") + reviews(t);
    return `<a class="tcard p${t.p} k-${kind(t)}${blocked ? " is-blocked" : ""}" href="#"><div class="tt">${tags}${esc(t.title)}</div><span class="sl">${esc(t.slug)} <b class="pr">p${t.p}</b></span>${waitLine(t)}</a>`;
  };
  // Who the open work waits on, in the order the strip and the groups use: what needs someone
  // first, then work going on, then work that waits by design.
  const GROUPS = [
    { k: "you", label: "On you", chip: "on you" },
    { k: "nobody", label: "On nobody", chip: "on nobody" },
    { k: "check", label: "On the nightly", chip: "on the nightly" },
    { k: "task", label: "On other tasks", chip: "on other tasks" },
    { k: "agent", label: "On an agent", chip: "on an agent" },
    { k: "working", label: "Working", chip: "working" },
    { k: "queued", label: "Queued", chip: "queued" },
    { k: "parked", label: "Parked", chip: "parked" },
  ];
  const count = (list, k) => list.filter((t) => kind(t) === k).length;
  const strip = (list, lead) => `<div class="stuck">${lead}${GROUPS.map((g) => `<a class="chip k-${g.k}" href="#">${g.chip} <i>${count(list, g.k)}</i></a>`).join("")}</div>`;
  // One cause said once, never on the cards it holds back: no orchestrator is live, so ready work with
  // nothing before it and no live executor (PULL's own rule) waits to start. A stale one is named stale.
  const unstarted = open.filter((t) => t.s === "ready" && ["queued", "nobody"].includes(kind(t))).length;
  const banner = () => `<div class="banner warn"><b>No live orchestrator.</b> sable-finch-625 is stale, glacial-heron-497 left · ${unstarted} of the ${B.counts.ready} ready tasks wait to start</div>`;
  // Today's header, names and rows as the shared server draws them: its design is app/header-names'.
  const header = () => `<nav class="hdr"><a class="pill">Change board</a><a>⌂ board</a><a>≡ docs</a><a class="on">▦ tasks</a><a>◉ agents</a><a>⬡ catalogue</a><span class="sep"></span><span class="sect">tasks</span><span class="end">activity</span></nav>`;
  // Today's title row and filters, labels and all; `status` keeps the Status filter (A only).
  const head = (o = {}) => `<div class="title"><h1>Tasks</h1><a class="who">Who is connected</a></div><div class="filters"><label>Search tasks and messages<span class="search"></span></label>${o.status ? `<label>Status<span class="sel">All statuses</span></label>` : ""}<label>Finished tasks<span class="sel">Last 24 hours</span></label></div>`;
  // Today's buttons: the + that files a task, and the column pager (kept where columns scroll sideways).
  const fab = () => `<a class="fab">+</a>`;
  const pager = () => `<nav class="pager"><a>← prev</a><a>next →</a><a class="top">↑ top</a></nav>`;
  window.Mock = { B, esc, age, OLD, STAGES, NAME, kind, on, why, open, byAge, byPrio, card, waitLine, reviews, GROUPS, count, strip, banner, header, head, fab, pager };
})();
</script>
<script>
const M = window.Mock, B = M.B;
const phone = matchMedia("(max-width:760px)").matches;
const C = B.counts;
const flowStages = [["concept", C.concept], ["design", C.design], ["ready", C.ready], ["in_progress", C.in_progress], ["review", C.review], ["blocked", C.blocked]];
const total = flowStages.reduce((n, [, c]) => n + c, 0);
const flow = `<div class="flow">${flowStages.map(([s, n]) => `<a data-s="${s}" style="flex:${Math.max(n, 4)}">${M.NAME[s]} <i>${n}</i></a>`).join("")}</div><div class="flowlist">${flowStages.map(([s, n]) => `<span data-s="${s}">${M.NAME[s]} <i>${n}</i></span>`).join("")}</div><div class="flowkey">${total} open · ${C.done} done and ${C.cancelled} cancelled today · ${C.backlog} more in backlog</div>`;
const row = (t) => {
  const w = M.why(t);
  const st = `<span class="st" data-s="${t.s}">${M.NAME[t.s]}${t.rounds ? ` · ${t.rounds} review${t.rounds > 1 ? "s" : ""}` : ""}</span>`;
  return `<a class="row p${t.p}"><div><div class="tt">${M.esc(t.title)}</div><span class="sl">${M.esc(t.slug)}</span></div>${st}<div class="wcell">${st}<span class="why">${["task", "agent"].includes(t.w.k) ? `<b>${M.esc(t.w.who)}</b> · ` : ""}${M.esc(w)}</span></div><div class="dur"><b class="${t.h >= M.OLD && !["queued", "parked"].includes(t.w.k) ? "old" : ""}">${M.age(t.h)}</b></div></a>`;
};
const order = M.GROUPS.map((g) => g.k);
const caps = phone ? { you: 4, nobody: 3, check: 2, task: 2, agent: 1, working: 2, queued: 2, parked: 2 } : { you: 5, nobody: 4, check: 3, task: 3, agent: 1, working: 2, queued: 3, parked: 2 };
const groups = order.map((k) => {
  const rows = M.open.filter((t) => M.kind(t) === k).sort(M.byAge);
  const g = M.GROUPS.find((x) => x.k === k);
  const old = rows.length ? `oldest ${M.age(rows[0].h)}` : "";
  return `<section class="grp k-${k}"><h2><i>●</i>${g.label} <span class="n">${rows.length}</span><span class="old">${k === "working" ? "" : old}</span></h2><div class="rows">${rows.slice(0, caps[k]).map(row).join("")}${rows.length > caps[k] ? `<a class="more" href="#">+${rows.length - caps[k]} more</a>` : ""}</div></section>`;
}).join("");
document.getElementById("page").innerHTML = `${M.header()}<main>${M.head()}${flow}${M.banner()}${groups}</main>${M.fab()}`;
</script>
</body>
