<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board B: stuck in place</title>
<link rel="stylesheet" href="board-mock.css">
<style>
/* B: no blocked column. A blocked task stays in the stage it stopped in, first in it, marked; every
   stage fits the screen wide; a phone shows one stage at a time behind tabs. */
.cols { display:grid; grid-template-columns:34px repeat(4,minmax(0,1fr)) 22px repeat(2,minmax(0,1fr)); gap:8px; align-items:start; }
.cols .col { min-height:120px; }
.col .sub { font-size:.72rem; color:var(--muted-foreground); margin:-4px 2px 8px; white-space:nowrap; }
.col .sub b { color:var(--dislike); }
.backlog { writing-mode:vertical-rl; transform:rotate(180deg); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--pending); font-weight:700; border:1px solid var(--border); border-top:3px solid var(--pending); border-radius:var(--r-lg); padding:12px 6px; background:var(--card); text-align:right; }
.tabs { display:none; }
.foot { margin-top:10px; font-size:var(--fs-sm); color:var(--muted-foreground); }
@media (max-width:760px) {
  .cols { display:block; }
  .cols > :not(.col[data-s=review]) { display:none; }
  .cols .col { border:0; background:none; padding:0; }
  .cols .col h2 { display:none; }
  .tabs { display:flex; gap:6px; overflow:hidden; margin:0 -14px 10px; padding:0 14px; white-space:nowrap; }
  .tabs a { font-size:var(--fs-sm); font-weight:600; border:1px solid var(--border); border-radius:var(--r-pill); padding:3px 10px; background:var(--card); }
  .tabs a.on { color:var(--primary); border-color:var(--primary); }
  .tabs a i { font-style:normal; color:var(--muted-foreground); margin-left:4px; }
  .tabs a b { color:var(--dislike); margin-left:4px; }
}
</style>
</head>
<body>
<div id="page"></div>
<script src="sf-board.js"></script>
<script src="board-mock.js"></script>
<script>
const M = window.Mock, B = M.B;
const at = (t) => (t.s === "blocked" ? t.from : t.s);
const stage = (s) => {
  const all = B.tasks.filter((t) => at(t) === s);
  // Blocked work first, in the strip's order (on you, on nobody, a check, a task), oldest first
  // within each; parked work, blocked on purpose, goes after the stage's own.
  const rank = (t) => M.GROUPS.findIndex((g) => g.k === M.kind(t));
  const blocked = all.filter((t) => t.s === "blocked").sort((a, b) => rank(a) - rank(b) || M.byAge(a, b));
  const rest = all.filter((t) => t.s !== "blocked").sort(s === "done" ? (a, b) => a.h - b.h : M.byAge);
  const parked = blocked.filter((t) => M.kind(t) === "parked");
  const rows = blocked.filter((t) => M.kind(t) !== "parked").concat(rest, parked);
  const oldest = s === "done" ? 0 : Math.max(0, ...all.map((t) => t.h));
  const sub = s === "done" ? `${B.counts.cancelled} cancelled · today` : `${blocked.length ? `<b>+${blocked.length} blocked</b> · ` : ""}oldest ${M.age(oldest)}`;
  return { s, all, rows, blocked, sub };
};
const column = (st, cap) => `<section class="col" data-s="${st.s}"><h2>${M.NAME[st.s]} <span class="n">${st.all.length - st.blocked.length}</span></h2><div class="sub">${st.sub}</div>${st.rows.slice(0, cap).map((t) => M.card(t, { blockedTag: true })).join("")}${st.rows.length > cap ? `<a class="more" href="#">+${st.rows.length - cap} more</a>` : ""}</section>`;
const stages = M.STAGES.map(stage);
const S = Object.fromEntries(stages.map((st) => [st.s, st]));
const tab = (st) => `<a class="${st.s === "review" ? "on" : ""}">${M.NAME[st.s]}<i>${st.all.length - st.blocked.length}</i>${st.blocked.length ? `<b>+${st.blocked.length}</b>` : ""}</a>`;
document.getElementById("page").innerHTML = `${M.header()}<main>${M.head()}${M.banner()}
${M.strip(M.open, `<b>${M.open.length} open</b>`)}
<nav class="tabs fade">${["review", "in_progress", "ready", "done", "design", "concept"].map((s) => tab(S[s])).join("")}<a>Backlog<i>${B.counts.backlog}</i></a></nav>
<div class="cols"><div class="backlog">Backlog ${B.counts.backlog}</div>${["concept", "design", "ready", "in_progress"].map((s) => column(S[s], 10)).join("")}<div class="rail">build · test</div>${["review", "done"].map((s) => column(S[s], 10)).join("")}</div>
</main>${M.fab()}`;
</script>
</body>
</html>
