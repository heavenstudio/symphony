<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Where a person&#x27;s profile is kept</title>
<desc id="desc">A person&#x27;s profile holds their names, emails, git handles, chat usernames such as Slack, and preferences. Three places it could be kept. Under A each board keeps a whole profile with its people, so a person on three boards has three. Under B the server keeps one profile for each person, which that person edits, and each board keeps only their groups and what they may do. Under C it is as B, and the part that is public anyway, the short name on their lines and their git handles, is also a committed file of the project, so every clone reads it. In all three the short name is the only part written on a line. Recommended: B.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.hot{fill:none;stroke:var(--dislike);stroke-width:1.5}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.red{fill:var(--dislike)}
.blue{fill:var(--primary)}
.arrow{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip)}
.both{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip);marker-start:url(#tail)}
.no{stroke:var(--dislike);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.tipfill{fill:var(--muted-foreground)}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M10,0 L0,5 L10,10 z"/></marker></defs>
<rect class="page" width="760" height="470"/>
<text class="t" x="24" y="34">Where a person&#x27;s profile is kept</text>
<rect class="card" x="24" y="60" width="232" height="294" rx="8"/>
<text class="h" x="38" y="86">A: with each board</text>
<text class="m" x="38" y="106">one profile per board</text>
<rect class="inner" x="38" y="122" width="204" height="69" rx="5"/>
<text class="m" x="48" y="142">board one</text>
<text x="48" y="161">ana&#x27;s profile</text>
<text x="48" y="180">and what ana may do</text>
<rect class="inner" x="38" y="201" width="204" height="69" rx="5"/>
<text class="m" x="48" y="221">board two</text>
<text x="48" y="240">ana&#x27;s profile, again</text>
<text x="48" y="259">and what ana may do</text>
<text class="red" x="48" y="300">A Slack name changed</text>
<text class="red" x="48" y="319">is changed on each board.</text>
<rect class="card" x="264" y="60" width="232" height="294" rx="8"/>
<text class="h" x="278" y="86">B: once, with the server</text>
<text class="m" x="278" y="106">recommended</text>
<rect class="new" x="278" y="122" width="204" height="69" rx="5"/>
<text class="m" x="288" y="142">the server, once</text>
<text x="288" y="161">ana&#x27;s profile,</text>
<text x="288" y="180">which ana edits</text>
<rect class="inner" x="278" y="201" width="204" height="69" rx="5"/>
<text class="m" x="288" y="221">each board</text>
<text x="288" y="240">ana&#x27;s groups and</text>
<text x="288" y="259">what ana may do</text>
<text class="m" x="288" y="300">Who someone is, apart</text>
<text class="m" x="288" y="319">from what they may do.</text>
<rect class="card" x="504" y="60" width="232" height="294" rx="8"/>
<text class="h" x="518" y="86">C: and its public part in git</text>
<text class="m" x="518" y="106">a file of the project</text>
<rect class="new" x="518" y="122" width="204" height="50" rx="5"/>
<text class="m" x="528" y="142">the server, once</text>
<text x="528" y="161">ana&#x27;s profile</text>
<rect class="new" x="518" y="182" width="204" height="69" rx="5"/>
<text class="m" x="528" y="202">committed, public part</text>
<text x="528" y="221">ana, her display name,</text>
<text x="528" y="240">her git handles</text>
<text class="red" x="528" y="281">A new person is</text>
<text class="red" x="528" y="300">a landing as well.</text>
<rect class="card" x="24" y="376" width="712" height="70" rx="8"/>
<text x="40" y="402">Under every option a line carries only the short name (ana · approved), emails and chat</text>
<text x="40" y="424">usernames are in no repository, and no agent or plugin is handed them.</text>
</svg>
