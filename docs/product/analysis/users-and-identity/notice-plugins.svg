<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" role="img" aria-labelledby="title desc">
<title id="title">Notices: the format in the core, a plugin for each service</title>
<desc id="desc">A card for the design group is posted, and the board decides who is told: its members. The server reads each member's profile for the way they chose, and the core makes one notice message, a format kept stable across releases. It hands the message to the plugin for that way. Three plugins, each a task of its own and none of them in the core: the Slack plugin keeps the Slack app's bot token and sends to the person's Slack user, following Slack's interface as it changes; the WhatsApp plugin keeps the business account's token and sends to the person's WhatsApp number, with templates Meta approved first; the email plugin keeps the mail server's password and sends to the person's email, a standard that changes little. Each is a package the core does not link, set up by whoever runs the server, in no project's file, and the page and the Mac app show every notice, sent or not.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.line{stroke:var(--muted-foreground);stroke-width:1.5;fill:none}
.arrow{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip)}
.tipfill{fill:var(--muted-foreground)}
</style>
