<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">A: the Symphony ships the check alone</title>
<desc id="desc">Under A a person&#x27;s browser reaches the server through a sign-in service the project already has, such as a company&#x27;s OAuth 2 proxy, which is not the Symphony&#x27;s. It signs a header on each request. The Symphony&#x27;s core checks that header and ships the format it accepts. The Symphony writes no sign-in code, and nothing works for several people until someone sets a proxy up.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.hot{fill:none;stroke:var(--dislike);stroke-width:1.5}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.red{fill:var(--dislike)}
.blue{fill:var(--primary)}
.arrow{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip)}
.both{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip);marker-start:url(#tail)}
.no{stroke:var(--dislike);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.tipfill{fill:var(--muted-foreground)}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M10,0 L0,5 L10,10 z"/></marker></defs>
<rect class="page" width="760" height="430"/>
<text class="t" x="24" y="34">A: the Symphony ships the check alone</text>
<rect class="card" x="24" y="60" width="232" height="254" rx="8"/>
<text class="h" x="38" y="86">A person&#x27;s browser</text>
<text class="m" x="38" y="106">signs in, then asks</text>
<rect class="inner" x="38" y="122" width="204" height="69" rx="5"/>
<text x="48" y="142">sent to Google, GitHub</text>
<text x="48" y="161">or a company to sign in</text>
<text class="m" x="48" y="180">OAuth 2</text>
<rect class="card" x="264" y="60" width="232" height="254" rx="8"/>
<text class="h" x="278" y="86">In front: not ours</text>
<text class="m" x="278" y="106">a proxy the project has</text>
<rect class="inner" x="278" y="122" width="204" height="69" rx="5"/>
<text x="288" y="142">an existing OAuth 2</text>
<text x="288" y="161">proxy, set up by</text>
<text x="288" y="180">the project</text>
<text class="blue" x="288" y="221">signs a header on</text>
<text class="blue" x="288" y="240">each request</text>
<text class="red" x="288" y="281">Nothing works until</text>
<text class="red" x="288" y="300">someone sets one up.</text>
<rect class="card" x="504" y="60" width="232" height="254" rx="8"/>
<text class="h" x="518" y="86">The core</text>
<text class="m" x="518" y="106">verifies only</text>
<rect class="new" x="518" y="122" width="204" height="69" rx="5"/>
<text class="m" x="528" y="142">the Symphony&#x27;s</text>
<text x="528" y="161">checks the signature,</text>
<text x="528" y="180">fresh, for this server</text>
<text class="m" x="528" y="221">No password, no client</text>
<text class="m" x="528" y="240">secret, no sign-in page.</text>
<rect class="card" x="24" y="336" width="712" height="70" rx="8"/>
<text x="40" y="362">The core trusts only what a key in the server&#x27;s settings verifies. The service is the</text>
<text x="40" y="384">server&#x27;s plugin, never a project&#x27;s. On a machine, Tailscale is the service.</text>
</svg>
