<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Whose agent may review a task</title>
<desc id="desc">Ana filed a task and started work on it. Three agents could review it: the board's staffed reviewer, a shared agent acting by its role; li's personal agent; and ana's own personal agent, a fresh session working on ana's word. Under A, sessions alone as today, all three may review. Under B, not their own agent, the shared reviewer and li's agent may review and ana's own personal agent gives the task no verdict. Under both a board with nobody named reviews as today, and a review is an agent's verdict, never a person's decision. Recommended: B.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.hot{fill:none;stroke:var(--dislike);stroke-width:1.5}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.red{fill:var(--dislike)}
.blue{fill:var(--primary)}
</style>
<rect class="page" width="760" height="440"/>
<text class="t" x="24" y="34">Whose agent may review a task</text>
<rect class="inner" x="24" y="52" width="712" height="40" rx="5"/>
<text x="38" y="77"><tspan class="b">The task:</tspan> ana filed it and started its work. Three fresh sessions could review it.</text>
<rect class="card" x="24" y="108" width="232" height="232" rx="8"/>
<text class="h" x="38" y="134">The three reviewers</text>
<text class="m" x="38" y="154">all fresh sessions</text>
<rect class="inner" x="38" y="170" width="204" height="44" rx="5"/>
<text x="48" y="188">the board's reviewer</text>
<text class="m" x="48" y="206">shared, acts by its role</text>
<rect class="inner" x="38" y="222" width="204" height="44" rx="5"/>
<text x="48" y="240">li's personal agent</text>
<text class="m" x="48" y="258">on li's word</text>
<rect class="inner" x="38" y="274" width="204" height="44" rx="5"/>
<text x="48" y="292">ana's personal agent</text>
<text class="m" x="48" y="310">on ana's word</text>
<rect class="card" x="264" y="108" width="232" height="232" rx="8"/>
<text class="h" x="278" y="134">A: sessions alone</text>
<text class="m" x="278" y="154">as today</text>
<rect class="inner" x="278" y="170" width="204" height="44" rx="5"/>
<text x="288" y="197">may review</text>
<rect class="inner" x="278" y="222" width="204" height="44" rx="5"/>
<text x="288" y="249">may review</text>
<rect class="hot" x="278" y="274" width="204" height="44" rx="5"/>
<text class="red" x="288" y="292">may review: ana's own</text>
<text class="red" x="288" y="310">read of ana's work</text>
<rect class="card" x="504" y="108" width="232" height="232" rx="8"/>
<text class="h" x="518" y="134">B: not their own agent</text>
<text class="m" x="518" y="154">recommended</text>
<rect class="inner" x="518" y="170" width="204" height="44" rx="5"/>
<text x="528" y="197">may review</text>
<rect class="inner" x="518" y="222" width="204" height="44" rx="5"/>
<text x="528" y="249">may review</text>
<rect class="new" x="518" y="274" width="204" height="44" rx="5"/>
<text class="blue" x="528" y="292">no verdict on a task</text>
<text class="blue" x="528" y="310">of ana's</text>
<rect class="card" x="24" y="356" width="712" height="64" rx="8"/>
<text x="40" y="382">Under both a board with nobody named reviews as today,</text>
<text x="40" y="402">and a review is an agent's verdict, never a person's decision.</text>
</svg>
