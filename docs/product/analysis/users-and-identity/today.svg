<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Today: everyone the gate lets in writes as the one owner</title>
<desc id="desc">Three browsers reach the server: this Mac&#x27;s, your phone under your Tailscale login, and a colleague&#x27;s laptop under another login in the same tailnet. The gate asks only whether the address is this machine or a machine of the tailnet. Tailscale&#x27;s answer also says whose machine it is, and that part is not read. The server records every write as owner, so all three are the same owner in the record.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.hot{fill:none;stroke:var(--dislike);stroke-width:1.5}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.red{fill:var(--dislike)}
.blue{fill:var(--primary)}
.arrow{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip)}
.both{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip);marker-start:url(#tail)}
.no{stroke:var(--dislike);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.tipfill{fill:var(--muted-foreground)}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M10,0 L0,5 L10,10 z"/></marker></defs>
<rect class="page" width="760" height="400"/>
<text class="t" x="24" y="34">Today: everyone the gate lets in writes as the one owner</text>
<rect class="card" x="24" y="60" width="210" height="60" rx="8"/>
<text class="b" x="38" y="85">This Mac&#x27;s browser</text>
<text class="m" x="38" y="105">the machine itself</text>
<path class="arrow" d="M234,90 L286,90"/>
<rect class="card" x="24" y="136" width="210" height="60" rx="8"/>
<text class="b" x="38" y="161">Your phone</text>
<text class="m" x="38" y="181">your Tailscale login</text>
<path class="arrow" d="M234,166 L286,166"/>
<rect class="card" x="24" y="212" width="210" height="60" rx="8"/>
<text class="b" x="38" y="237">A colleague&#x27;s laptop</text>
<text class="m" x="38" y="257">another login, same tailnet</text>
<path class="arrow" d="M234,242 L286,242"/>
<rect class="card" x="290" y="60" width="210" height="212" rx="8"/>
<text class="h" x="304" y="86">The gate</text>
<text x="304" y="112">Is this address this</text>
<text x="304" y="131">machine, or a machine</text>
<text x="304" y="150">of the tailnet?</text>
<rect class="hot" x="304" y="180" width="182" height="78" rx="5"/>
<text class="red" x="314" y="202">Tailscale also says</text>
<text class="red" x="314" y="221">whose machine it is.</text>
<text class="red" x="314" y="240">That is not read.</text>
<path class="arrow" d="M500,166 L532,166"/>
<rect class="card" x="536" y="60" width="200" height="212" rx="8"/>
<text class="h" x="550" y="86">The server</text>
<text x="550" y="112">Every write is</text>
<text x="550" y="131">recorded as one</text>
<text x="550" y="150">sender:</text>
<rect class="inner" x="550" y="172" width="172" height="86" rx="5"/>
<text class="mono" x="560" y="194">owner · approved</text>
<text class="mono" x="560" y="216">owner: a message</text>
<text class="mono" x="560" y="238">owner moved it</text>
<rect class="card" x="24" y="296" width="712" height="80" rx="8"/>
<text class="h" x="40" y="322">What follows</text>
<text x="40" y="344">All three browsers are the same owner in the record: nobody&#x27;s name is on a line,</text>
<text x="40" y="363">and the colleague&#x27;s laptop decides a card as you do.</text>
</svg>
