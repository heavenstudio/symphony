<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">What the Symphony ships for sending notices</title>
<desc id="desc">Three options for what the Symphony ships of the notice program, the server's plugin outside the core. Under A it ships the message's format alone, so notices stay on the page and in the Mac app until someone writes a program. Under B it ships the format and a notice program of its own for mail and Slack, which any other replaces; the Symphony then follows Slack's interface and keeps its token safe. Under C it ships the format and a program for mail alone, and Slack is left to programs others write. Under every option the program is a package the core does not link, set up once by whoever runs the server, and nothing of it is in a project's file. Recommended: B.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.red{fill:var(--dislike)}
</style>
<rect class="page" width="760" height="420"/>
<text class="t" x="24" y="34">What the Symphony ships for sending notices</text>
<rect class="card" x="24" y="60" width="232" height="276" rx="8"/>
<text class="h" x="38" y="86">A: the format alone</text>
<text class="m" x="38" y="106">no program</text>
<rect class="inner" x="38" y="122" width="204" height="50" rx="5"/>
<text class="mono" x="48" y="142">notice message</text>
<text class="m" x="48" y="161">a contract, kept stable</text>
<text class="red" x="48" y="285">Nothing is sent until</text>
<text class="red" x="48" y="304">someone writes a program.</text>
<rect class="card" x="264" y="60" width="232" height="276" rx="8"/>
<text class="h" x="278" y="86">B: mail and Slack</text>
<text class="m" x="278" y="106">recommended</text>
<rect class="inner" x="278" y="122" width="204" height="50" rx="5"/>
<text class="mono" x="288" y="142">notice message</text>
<text class="m" x="288" y="161">a contract, kept stable</text>
<rect class="new" x="278" y="182" width="204" height="50" rx="5"/>
<text x="288" y="202">A program of its own:</text>
<text class="mono" x="288" y="221">mail · Slack</text>
<text class="m" x="288" y="285">The Symphony follows</text>
<text class="m" x="288" y="304">Slack's interface.</text>
<rect class="card" x="504" y="60" width="232" height="276" rx="8"/>
<text class="h" x="518" y="86">C: mail alone</text>
<text class="m" x="518" y="106">Slack left to others</text>
<rect class="inner" x="518" y="122" width="204" height="50" rx="5"/>
<text class="mono" x="528" y="142">notice message</text>
<text class="m" x="528" y="161">a contract, kept stable</text>
<rect class="inner" x="518" y="182" width="204" height="50" rx="5"/>
<text x="528" y="202">A program of its own:</text>
<text class="mono" x="528" y="221">mail</text>
<text class="red" x="528" y="285">The Slack names in a</text>
<text class="red" x="528" y="304">profile wait for others.</text>
<rect class="card" x="24" y="352" width="712" height="48" rx="8"/>
<text x="40" y="378">Under every option it is outside the core, set up by whoever runs the server, in no project file.</text>
</svg>
