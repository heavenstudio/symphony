<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-labelledby="title desc">
<title id="title">Today: one repository, one project, one board</title>
<desc id="desc">On this machine a repository holds one project: its checkout, and each task's worktree, carry the project file, the documents with their cards, and the agents' guides, skills and justfile. The board is kept in the repository's git common dir, in one database named tasks. The machine's one server serves the project at its address from its registry. A clone of the same repository on another machine keeps a board of its own, counted apart until one central board. A project file in a subfolder names a second project, which reaches the same board.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.hot{fill:none;stroke:var(--dislike);stroke-width:1.5;stroke-dasharray:5 4}
.m{fill:var(--muted-foreground)}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.red{fill:var(--dislike)}
.blue{fill:var(--primary)}
.arrow{stroke:var(--muted-foreground);stroke-width:1.5;fill:none;marker-end:url(#tip)}
.tipfill{fill:var(--muted-foreground)}
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tipfill" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="page" width="760" height="452"/>
<text class="t" x="24" y="34">Today: one repository, one project, one board</text>
<rect class="card" x="24" y="56" width="476" height="318" rx="8"/>
<text class="h" x="38" y="82">This machine</text>
<rect class="inner" x="38" y="96" width="292" height="264" rx="5"/>
<text class="b" x="50" y="118">a repository</text>
<rect class="card" x="50" y="130" width="268" height="108" rx="5"/>
<text class="m" x="62" y="150">a checkout, or a task's worktree</text>
<text class="mono" x="62" y="174">symphony.toml</text>
<text class="mono" x="62" y="196">docs/</text><text class="m" x="112" y="196">documents, cards</text>
<text class="mono" x="62" y="218">AGENTS.md, skills, justfile</text>
<rect class="new" x="50" y="250" width="268" height="98" rx="5"/>
<text class="m" x="62" y="270">its git common dir</text>
<text class="mono" x="62" y="294">.git/symphony/tasks/</text>
<text class="blue" x="62" y="316">the board: one database,</text>
<text class="blue" x="62" y="336">named tasks</text>
<rect class="inner" x="344" y="96" width="142" height="160" rx="5"/>
<text class="b" x="356" y="118">the one server</text>
<text class="mono" x="356" y="142">projects.json</text>
<text class="m" x="356" y="164">one entry for it,</text>
<text class="m" x="356" y="184">by root and id</text>
<text class="mono" x="356" y="210">/lamp-shop/</text>
<text class="m" x="356" y="232">its pages, its board</text>
<path class="arrow" d="M344,210 L322,210"/>
<text class="m" x="344" y="290">Every worktree and</text>
<text class="m" x="344" y="310">every page of the</text>
<text class="m" x="344" y="330">project reach the</text>
<text class="m" x="344" y="350">same board.</text>
<rect class="card" x="514" y="56" width="222" height="318" rx="8"/>
<text class="h" x="528" y="82">Another machine</text>
<rect class="inner" x="528" y="96" width="194" height="152" rx="5"/>
<text class="b" x="540" y="118">a clone of it</text>
<text class="mono" x="540" y="144">symphony.toml</text>
<text class="mono" x="540" y="166">docs/</text>
<text class="mono" x="540" y="188">.git/symphony/tasks/</text>
<rect class="hot" x="536" y="200" width="178" height="38" rx="4"/>
<text class="red" x="546" y="224">a board of its own</text>
<text class="m" x="528" y="290">Counted apart for now,</text>
<text class="m" x="528" y="310">until one central board</text>
<text class="m" x="528" y="330">that every machine</text>
<text class="m" x="528" y="350">reaches.</text>
<rect class="card" x="24" y="388" width="712" height="52" rx="8"/>
<text x="40" y="410">One board for each repository, by where it is kept. A project file in a subfolder names a</text>
<text x="40" y="430">second project, with its own id and pages, which reaches that same board.</text>
</svg>
