<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">A second board: three shapes</title>
<desc id="desc">Three ways to have a second board. Several boards in one project: one repository and one project, whose two boards share the documents and cards, the project file, the skills, rules and recipes, the address, the branches and the landing. Several projects in one repository: each project a folder with its own project file, documents, skills and board, sharing the repository's history, branches, landing and root guides. One project per repository, as today: everything is each project's own, and they share only the machine's server and a person's profile. Under each shape a person's profile is the server's and what they may do is each board's, and several machines reach one board rather than one each.</desc>
<style>
:root{--background:#fbfaf7;--foreground:#1d1c1a;--muted-foreground:#6b6862;--border:#e4e0d8;--primary:#2f5d9e;--dislike:#b3392b;--question:#946a00;--card:#ffffff;--muted:rgba(127,127,127,.07)}
@media (prefers-color-scheme:dark){:root{--background:#161513;--foreground:#e8e4dc;--muted-foreground:#a19c93;--border:#2c2a26;--primary:#7fa7e0;--dislike:#e57a6a;--question:#e0b84c;--card:#1d1c19;--muted:rgba(255,255,255,.04)}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:var(--foreground)}
.page{fill:var(--background)}
.card{fill:var(--card);stroke:var(--border)}
.inner{fill:var(--muted);stroke:var(--border)}
.new{fill:none;stroke:var(--primary);stroke-width:1.5}
.m{fill:var(--muted-foreground)}
.s{font-size:13px}
.b{font-weight:600}
.h{font-size:15px;font-weight:600}
.t{font-size:17px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.blue{fill:var(--primary)}
</style>
<rect class="page" width="760" height="560"/>
<text class="t" x="24" y="34">A second board: three shapes</text>

<rect class="card" x="24" y="56" width="232" height="412" rx="8"/>
<text class="h" x="38" y="82">Several boards</text>
<text class="h" x="38" y="101">in one project</text>
<rect class="inner" x="38" y="116" width="204" height="222" rx="5"/>
<text class="m" x="48" y="136">one repository</text>
<rect class="card" x="48" y="146" width="184" height="182" rx="5"/>
<text class="mono" x="58" y="166">/lamp-shop/</text>
<text class="m s" x="58" y="186">one project file,</text>
<text class="m s" x="58" y="204">documents, skills,</text>
<text class="m s" x="58" y="222">rules and recipes</text>
<rect class="new" x="58" y="236" width="78" height="82" rx="4"/>
<text class="b" x="66" y="256">board</text>
<text class="mono blue" x="66" y="274">build</text>
<text class="m s" x="66" y="294">tasks,</text>
<text class="m s" x="66" y="310">people</text>
<rect class="new" x="144" y="236" width="78" height="82" rx="4"/>
<text class="b" x="152" y="256">board</text>
<text class="mono blue" x="152" y="274">art</text>
<text class="m s" x="152" y="294">tasks,</text>
<text class="m s" x="152" y="310">people</text>
<text class="b" x="38" y="364">Shared by its boards</text>
<text class="m" x="38" y="386">the documents and cards,</text>
<text class="m" x="38" y="406">the project file, skills,</text>
<text class="m" x="38" y="426">rules, recipes, address,</text>
<text class="m" x="38" y="446">branches and landing</text>

<rect class="card" x="264" y="56" width="232" height="412" rx="8"/>
<text class="h" x="278" y="82">Several projects</text>
<text class="h" x="278" y="101">in one repository</text>
<rect class="inner" x="278" y="116" width="204" height="222" rx="5"/>
<text class="m" x="288" y="136">one repository</text>
<rect class="card" x="288" y="146" width="184" height="84" rx="5"/>
<text class="mono" x="298" y="166">game/  /game/</text>
<text class="m s" x="298" y="186">own project file,</text>
<text class="m s" x="298" y="204">documents, skills</text>
<text class="blue" x="298" y="222">its board</text>
<rect class="card" x="288" y="242" width="184" height="86" rx="5"/>
<text class="mono" x="298" y="262">site/  /site/</text>
<text class="m s" x="298" y="282">own project file,</text>
<text class="m s" x="298" y="300">documents, skills</text>
<text class="blue" x="298" y="318">its board</text>
<text class="b" x="278" y="364">Shared by its projects</text>
<text class="m" x="278" y="386">the git history, the</text>
<text class="m" x="278" y="406">branches and landing,</text>
<text class="m" x="278" y="426">the guides at the</text>
<text class="m" x="278" y="446">repository's root</text>

<rect class="card" x="504" y="56" width="232" height="412" rx="8"/>
<text class="h" x="518" y="82">One project per</text>
<text class="h" x="518" y="101">repository: today</text>
<rect class="inner" x="518" y="116" width="204" height="106" rx="5"/>
<text class="m" x="528" y="136">a repository</text>
<rect class="card" x="528" y="146" width="184" height="66" rx="5"/>
<text class="mono" x="538" y="166">/game/</text>
<text class="m s" x="538" y="184">all its own</text>
<text class="blue" x="538" y="202">its board</text>
<rect class="inner" x="518" y="232" width="204" height="106" rx="5"/>
<text class="m" x="528" y="252">another repository</text>
<rect class="card" x="528" y="262" width="184" height="66" rx="5"/>
<text class="mono" x="538" y="282">/site/</text>
<text class="m s" x="538" y="300">all its own</text>
<text class="blue" x="538" y="318">its board</text>
<text class="b" x="518" y="364">Shared</text>
<text class="m" x="518" y="386">the machine's server,</text>
<text class="m" x="518" y="406">a person's profile</text>

<rect class="card" x="24" y="482" width="712" height="64" rx="8"/>
<text x="40" y="508">Under each shape a person's profile is the server's, and what they may do is each board's.</text>
<text x="40" y="528">Several machines on one project reach one board, the central board, rather than one each.</text>
</svg>
