<title>Token cost mockup</title>
<style>
/* A design mockup of a task's cost on its board card and in its timeline, drawn from one task's
   recorded timeline and its recorded tokens (embedded below). It reads and writes nothing. The
   timeline is the approved navigation proposal's (docs/analysis/timeline-navigation/mockup.html),
   quiet stretches skipped. Tokens are the client's (apps/symphony-web/src/styles/board.css). */
:root { --background:#fbfaf7; --foreground:#1d1c1a; --muted-foreground:#6b6862; --border:#e4e0d8; --primary:#2f5d9e;
  --like:#2e7d4f; --dislike:#b3392b; --question:#946a00; --decision:#4a3f9e; --resolved:#5f6b73; --auto:#1f7a8c;
  --card:#ffffff; --muted:rgba(127,127,127,.07); --cost:#7a3f9e;
  --font-sans:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --fs-xs:.75rem; --fs-sm:.875rem; }
@media (prefers-color-scheme: dark) {
  :root { --background:#161513; --foreground:#e8e4dc; --muted-foreground:#a19c93; --border:#2c2a26; --primary:#7fa7e0;
    --like:#6fc48f; --dislike:#e57a6a; --question:#e0b84c; --decision:#a89ce8; --resolved:#8f9aa3; --auto:#5cc4d6;
    --card:#1d1c19; --muted:rgba(255,255,255,.04); --cost:#c99be8; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 15px/1.45 var(--font-sans); }
main { max-width: 1440px; margin: 0 auto; padding: 16px 24px 32px; }
h2 { font-size: 1.6rem; margin: 8px 0 12px; }
h3.sec { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); margin: 0 0 8px; }
.mock-note { margin: 0 0 12px; color: var(--muted-foreground); font-size: var(--fs-xs); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 24px 16px; }
.totals { margin: 0 0 4px; color: var(--muted-foreground); font-size: var(--fs-sm); }
.totals .money { color: var(--foreground); font-weight: 600; }
.spent { margin: 0 0 4px; color: var(--muted-foreground); font-size: var(--fs-sm); }
.spent b { color: var(--foreground); font-weight: 600; font-variant-numeric: tabular-nums; }
.head { margin-bottom: 10px; }
.muted { color: var(--muted-foreground); }

/* The top: the card on the board, and what is left at the page's foot. */
.top { display: flex; gap: 32px; align-items: flex-start; margin-bottom: 18px; }
.column { width: 280px; flex: 0 0 auto; padding: 8px; border-radius: 12px; border: 1px solid var(--border); border-top: 3px solid var(--like); background: color-mix(in srgb, var(--muted-foreground) 5%, var(--background)); }
.foot { flex: 1; max-width: 520px; font-size: var(--fs-sm); }
.foot p { margin: 0 0 6px; }

/* The board card: board.css and boardwait.css as they are, with the cost moved. */
.wcard { box-sizing: border-box; height: 110px; padding: 7px 10px; margin: 0 0 8px; border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 10px; background: var(--card); font-size: .875rem; }
.wcard:last-child { margin-bottom: 0; }
.wcard.p1 { border-left-color: var(--question); }
.wcard .title { margin: 0; font-weight: 600; line-height: 1.35; height: 37.8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.review-mark { display: inline-block; font-size: .66rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 0 6px; border-radius: 999px; margin-right: 6px; color: var(--question); background: color-mix(in srgb, var(--question) 14%, transparent); vertical-align: 1px; }
.wslug { display: flex; gap: 4px; margin-top: 2px; line-height: 16px; font-size: .72rem; color: var(--muted-foreground); }
.wslug code { font-family: var(--font-mono); display: flex; white-space: nowrap; overflow: hidden; min-width: 0; flex: 0 1 auto; }
.wslug .cut-head { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wslug .cut-tail { flex-shrink: 0; }
.wslug .prio { flex-shrink: 0; font-weight: 700; }
.wcard.p1 .prio { color: var(--question); }
.wcard.p2 .prio { color: var(--foreground); }
.wslug .more { margin-left: auto; padding-left: 6px; }
.wslug .cost { flex-shrink: 0; font-variant-numeric: tabular-nums; }
.wait { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; margin-top: 4px; font-size: .78rem; }
.wait .on { color: var(--k); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wait .age { grid-row: 1; grid-column: 2; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wait .age .dot { font-weight: 400; color: var(--muted-foreground); padding: 0 3px; }
.wait .why { grid-column: 1 / -1; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wait.under .why { grid-column: 1; }
.wait .cost2 { grid-row: 2; grid-column: 2; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-done { --k: var(--dislike); }
.k-working { --k: var(--like); }
.phone .column { width: auto; border: 0; background: none; padding: 0; }
.phone .top { display: block; }
.phone .foot { margin-top: 14px; max-width: none; }
.phone .wcard .title { font-size: 15px; }

/* The toolbar: the view, its zoom and the quiet stretches' switch (the approved proposal). */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0; font-size: var(--fs-sm); }
.group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.group button { font: inherit; color: inherit; background: transparent; border: 0; padding: 4px 12px; }
.group button + button { border-left: 1px solid var(--border); }
.group button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); font-weight: 600; }
.range { font-variant-numeric: tabular-nums; }
.skip { display: inline-flex; align-items: center; gap: 6px; }
.skip input { accent-color: var(--primary); margin: 0; }

/* The lanes: a name column, then a track per lane on one scale. */
.lanes { --name: 152px; --end: 88px; position: relative; }
.axis { position: relative; height: 22px; margin: 0 var(--end) 0 var(--name); }
.tick-label { position: absolute; top: 0; transform: translateX(-50%); color: var(--muted-foreground); font-size: var(--fs-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tick-label.day { color: var(--foreground); font-weight: 600; }
.hours { position: absolute; left: var(--name); right: var(--end); top: 22px; bottom: 0; pointer-events: none; }
.hour { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--border); }
.lane { display: flex; border-bottom: 1px solid var(--border); position: relative; }
.lane .name { flex: 0 0 var(--name); padding-right: 8px; display: flex; flex-direction: column; justify-content: center; font-size: var(--fs-sm); min-width: 0; }
.lane .name b { font-weight: 600; }
.lane .name b .money { color: var(--cost); font-variant-numeric: tabular-nums; }
.lane .name small { color: var(--muted-foreground); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; flex: 1; margin-right: var(--end); min-width: 0; }
.seg { position: absolute; box-sizing: border-box; min-width: 2px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, transparent);
  color: var(--c); font-size: var(--fs-xs); font-weight: 600; }
.seg.hold { border-style: dashed; background: color-mix(in srgb, var(--c) 6%, transparent); color: var(--muted-foreground); }
.seg.focus { outline: 2px solid var(--foreground); outline-offset: 1px; }
.after { position: absolute; font-size: var(--fs-xs); font-weight: 600; color: var(--c); white-space: nowrap; }
.run { position: absolute; height: 14px; border-radius: 2px; background: color-mix(in srgb, var(--c) 70%, transparent); outline: 1px solid var(--card);
  color: var(--card); font-size: 10.5px; font-weight: 600; line-height: 14px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
@media (prefers-color-scheme: dark) { .run { color: #10100e; } }
.notkept { position: absolute; top: 0; bottom: 0; border-right: 1px dashed var(--muted-foreground);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted-foreground) 22%, transparent) 0 2px, transparent 2px 7px); }
.notkept span { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: var(--fs-xs); color: var(--muted-foreground); background: var(--card); padding: 0 4px; white-space: nowrap; }
.rail { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dotted color-mix(in srgb, var(--muted-foreground) 45%, transparent); }
.mark { position: absolute; width: 2px; height: 8px; margin-left: -1px; background: color-mix(in srgb, var(--muted-foreground) 85%, transparent); border-radius: 1px; }
.gate { display: flex; height: 18px; }
.gate .name { flex: 0 0 var(--name); padding-left: 10px; color: var(--muted-foreground); font-size: var(--fs-xs); line-height: 18px; }
.gate .track { height: 18px; }
.g { position: absolute; top: 7px; height: 0; border-top: 4px solid var(--c); }
.g.missing { border-top-style: dotted; }
.brk { position: absolute; top: 0; bottom: 0; background: var(--card); z-index: 2; display: flex; align-items: center; justify-content: center; }
.brk svg { position: absolute; top: 0; height: 100%; width: 6px; }
.brk .brk-l { left: -3px; } .brk .brk-r { right: -3px; }
.brk span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: var(--fs-xs); color: var(--muted-foreground); white-space: nowrap; }
.axis .brk-label { position: absolute; top: 0; transform: translateX(-50%); font-size: var(--fs-xs); font-weight: 600; color: var(--foreground); white-space: nowrap; background: var(--card); padding: 0 4px; }
/* Cost, as each option draws it. */
.spend { position: absolute; box-sizing: border-box; min-width: 3px; height: 18px; border-radius: 4px; background: color-mix(in srgb, var(--cost) 22%, transparent);
  border: 1px solid color-mix(in srgb, var(--cost) 65%, transparent); color: var(--cost); font-size: var(--fs-xs); font-weight: 700; line-height: 16px;
  padding: 0 5px; overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums; }
.spend.focus { outline: 2px solid var(--foreground); outline-offset: 1px; }
.spend-after { position: absolute; color: var(--cost); font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 18px; }
.strip { position: absolute; height: 5px; min-width: 3px; border-radius: 2px; background: var(--cost); }
.strip-label { position: absolute; color: var(--cost); font-size: 11px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 12px; }
.chip { position: absolute; z-index: 4; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: var(--fs-xs); white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.chip b { font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; padding: 0; margin: 12px 0 0; color: var(--muted-foreground); font-size: var(--fs-xs); }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.said { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--muted); font-size: var(--fs-sm); }
.said b { font-variant-numeric: tabular-nums; }

/* A phone: the list, a row per step, in the 240 px box until Show all. */
.phone main { padding: 8px 16px 24px; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { display: grid; grid-template-columns: 52px 18px 1fr auto; align-items: center; column-gap: 6px; min-height: 28px; font-size: 14px; }
.plist .t { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
.plist .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); justify-self: center; }
.plist .dia { width: 8px; height: 8px; border: 1.5px solid var(--muted-foreground); transform: rotate(45deg); justify-self: center; }
.plist .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .msg .lbl { color: var(--muted-foreground); font-size: 13px; }
.plist .len { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plist .len .money { color: var(--cost); }
.plist .stage { min-height: 44px; font-weight: 600; font-size: 15px; }
.plist .stage .pbar { grid-column: 3 / 5; height: 7px; border-radius: 3px; background: var(--c); margin-top: -6px; }
.plist .day { font-weight: 700; font-size: 13px; min-height: 24px; }
.plist .red { color: var(--dislike); font-weight: 600; }
.plist .cost { color: var(--cost); font-weight: 600; }
.plist .cost .lbl { color: var(--foreground); font-weight: 500; font-size: 13px; }
.plist .coin { width: 14px; height: 14px; border-radius: 50%; background: var(--cost); color: var(--card); font-size: 10px; font-weight: 800; line-height: 14px; text-align: center; justify-self: center; }
.plist .quiet { grid-template-columns: 1fr; margin: 6px 0; padding: 8px 10px; border: 1px dashed var(--muted-foreground); border-radius: 8px; background: var(--muted); }
.plist .quiet b { display: block; font-size: 14px; }
.plist .quiet small { color: var(--muted-foreground); font-size: 12px; }
.plist .kept .lbl { color: var(--muted-foreground); font-size: 13px; }
.plist .kept .sw { width: 14px; height: 10px; justify-self: center; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted-foreground) 45%, transparent) 0 2px, transparent 2px 5px); border: 1px dashed var(--muted-foreground); }
.pbox { display: flex; flex-direction: column; }
.pbox .pclip { height: 150px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28px); mask-image: linear-gradient(to bottom, transparent, #000 28px); }
.pfoot { display: flex; align-items: center; gap: 10px; padding-top: 8px; font-size: var(--fs-xs); color: var(--muted-foreground); }
.pfoot button { margin-left: auto; font: inherit; font-size: 14px; color: var(--foreground); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
.phone .panel { padding: 14px 14px 12px; }
.phone .totals, .phone .spent { font-size: 14px; }
</style>

    <p class="said"><b>${money(TOTAL)}</b>, ${estimate}${opt.timeline === "after" ? `: ${roleSplit(byRole)}` : ""} (${kinds}); ${amount(TOKENS)} tokens in ${COST.total.tokens.calls} calls.</p></section>`;
}

// ---- The timeline's head: the total beside the time, and the summary under it ----------------------
function head(opt, phone) {
  const after = opt.timeline === "after";
  const cost = `<span class="money" title="${esc(`${estimate} (${kinds})`)}">${money(TOTAL)}</span>${after ? "" : " estimated"}`;
  const all = after ? `${took(END - START)} in all ${cost}` : `${took(END - START)} in all · ${cost}`;
  const first = phone
    ? `${all}<br>${rounds.length} review rounds · ${DATA.bounces} bounces · machine ${took(machine)}`
    : `${all} · ${rounds.length} review rounds · ${DATA.bounces} bounces · machine ${took(machine)}, queued 0 m`;
  let html = `<p class="totals">${first}</p>`;
  if (opt.summary.includes("role")) html += `<p class="spent">Cost by role: ${byRole.map((r) => `${r.role} <b>${money(r.dollars)}</b>`).join(" · ")}</p>`;
  if (opt.summary.includes("round")) html += `<p class="spent">Cost by round: ${COST_ROUNDS.map((r) => `${r.short} <b>${money(r.dollars)}</b>`).join(" · ")}</p>`;
  return `<div class="head">${html}</div>`;
}

// ---- The wide timeline ------------------------------------------------------------------------------
const LANE = 40, RAIL = 35, BOARD = 22, ROW = 20;
function ticksFor(sc) {
  const steps = [300, 600, 900, 1800, 3600, 7200, 10800, 14400, 21600, 43200, 86400];
  const step = steps.find((s) => s * sc.perSecond >= 78) ?? 86400;
  const out = [];
  for (const p of sc.parts) {
    if (p.skip) continue;
    let t = Math.ceil((p.from + OFF) / step) * step - OFF;
    for (; t <= p.to; t += step) {
      const x = sc.at(t);
      if (out.length && x - out[out.length - 1].x < 50) continue;
      if (sc.skipped.some((q) => Math.abs(x - sc.at(q.from) - BREAK / 2) < 48 || (day(q.to) !== day(q.from) && x - sc.at(q.to) > -10 && x - sc.at(q.to) < 82))) continue;
      const midnight = (t + OFF) % 86400 === 0;
      out.push({ x, label: midnight ? day(t) : clock(t), day: midnight });
    }
  }
  return out;
}
function zigzag(h, cls) {
  let d = "M3 0"; for (let y = 0; y < h; y += 8) d += ` L6 ${y + 4} L0 ${y + 8}`;
  return `<svg class="${cls}" viewBox="0 0 6 ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`;
}
function wide(opt, view) {
  const app = document.getElementById("app");
  const W = Math.max(300, app.clientWidth - 48 - 48 - 152 - 88);
  const sc = scaleFor(view, W);
  const x = (t) => sc.at(t);
  const vis = (a, b) => b >= view.from && a <= view.to;
  const whole = view.from === START && view.to === END;
  let html = head(opt, false);
  html += `<div class="bar"><span class="group"><button aria-pressed="${whole}">Whole task</button><button aria-label="Zoom out">−</button><button aria-label="Zoom in">+</button></span>`;
  html += `<span class="range">${day(view.from)} ${clock(view.from)} → ${day(view.to)} ${clock(view.to)} · ${took(view.to - view.from)}${whole ? "" : ` of ${took(END - START)}`}</span>`;
  html += `<label class="skip"><input type="checkbox" checked> Skip quiet stretches <span class="muted">${QUIET.length} · ${took(QUIET.reduce((n, q) => n + q.to - q.from, 0))}</span></label></div>`;

  const ticks = ticksFor(sc);
  let lanesHtml = `<div class="axis">${ticks.map((t) => `<span class="tick-label${t.day ? " day" : ""}" style="left:${t.x}px">${t.label}</span>`).join("")}`;
  for (const q of sc.skipped) {
    lanesHtml += `<span class="brk-label" style="left:${x(q.from) + BREAK / 2}px">+${took(q.to - q.from)}</span>`;
    if (day(q.to) !== day(q.from)) lanesHtml += `<span class="tick-label day" style="left:${x(q.to) + 22}px;transform:none">${day(q.to)}</span>`;
  }
  lanesHtml += `</div>`;

  let y = 22;
  const laneHtml = [];
  const tops = {};
  const marksIn = (key) => messages.filter((m) => m.fromLane === key && vis(m.at, m.at));
  const markHtml = (list, railY) => list.map((m) => `<span class="mark" style="left:${x(m.at)}px;top:${railY - 4}px"></span>`).join("");
  const clip = (from, to) => { const a = Math.max(-1, x(from)), b = Math.min(W + 1, x(to)); return [a, Math.max(2, b - a)]; };
  const segHtml = (from, to, c, text, cls, top, h) => {
    const [a, w] = clip(from, to);
    const fits = text && w > text.length * 6.6 + 14;
    return `<span class="seg ${cls}" style="--c:var(--${c});left:${a}px;width:${w}px;top:${top}px;height:${h}px;line-height:${h - 2}px">${fits ? esc(text) : ""}</span>`;
  };
  // Stage.
  {
    let s = "";
    stages.forEach((st, i) => {
      if (st.status === "done" || !vis(st.from, st.to ?? END)) return;
      let text = st.status === "ready" ? `ready ${took(st.to - st.from)}` : st.status === "in_progress" ? took(st.to - st.from) : "";
      if (opt.timeline === "after") {
        // The product's label, its word and time or the time alone where only that fits, with the
        // stretch's cost after the time where both fit.
        const length = took((st.to ?? END) - st.from);
        const c = costOf(st);
        const tail = c ? ` ${money(c.dollars)}` : "";
        const [, w] = clip(st.from, st.to ?? END);
        text = [`${stageWord(st)} ${length}${tail}`, `${length}${tail}`, length].find((t) => w > t.length * 6.6 + 14) ?? "";
      }
      s += segHtml(st.from, st.to ?? END, tone(st.status), text, view.focusStage === i ? "focus" : "", 7, 26);
    });
    tops.stage = y;
    laneHtml.push(`<div class="lane"><span class="name"><b>Stage</b></span><span class="track" style="height:${LANE}px">${s}</span></div>`);
    y += LANE + 1;
  }
  // B: a cost row by round, each from its first recorded model call to its last.
  if (opt.timeline === "row") {
    // A round's dollars inside its bar where they fit, else under its start where the label before
    // leaves room; a round too narrow for either says them when pointed at, and zoom parts it.
    const H = 38;
    let s = "", reach = -Infinity;
    COST_ROUNDS.forEach((r) => {
      const [a, w] = clip(r.first, r.last);
      const label = money(r.dollars);
      const wide = label.length * 6.6 + 10;
      const inside = w >= wide;
      s += `<span class="spend${view.focus === r.n ? " focus" : ""}" style="left:${a}px;width:${Math.max(3, w)}px;top:3px">${inside ? label : ""}</span>`;
      if (!inside && a >= reach + 4) { s += `<span class="spend-after" style="left:${a}px;top:20px">${label}</span>`; reach = a + wide - 10; }
    });
    tops.cost = y;
    laneHtml.push(`<div class="lane"><span class="name"><b>Cost <span class="money">${money(TOTAL)}</span></b><small>by round, estimated</small></span><span class="track" style="height:${H}px">${s}</span></div>`);
    y += H + 1;
  }
  // Roles.
  const roleLane = (key, name, who, body, lane = LANE, rail = RAIL) => {
    tops[key] = y;
    laneHtml.push(`<div class="lane"><span class="name"><b>${name}</b><small>${who}</small></span><span class="track" style="height:${lane}px">${body}<span class="rail" style="top:${rail}px"></span>${markHtml(marksIn(key), rail)}</span></div>`);
    y += lane + 1;
  };
  // C: each role's rows drawn under its bars, from the first model call to the last.
  const strips = (role) => {
    if (opt.timeline !== "lanes") return "";
    const list = ROWS.filter((r) => r.role === role || (role === "executor" && r.role === "reserved")).sort((a, b) => a.first - b.first);
    let s = "";
    list.forEach((r, i) => {
      const [a, w] = clip(r.first, r.last);
      s += `<span class="strip" style="left:${a}px;width:${Math.max(3, w)}px;top:33px"></span>`;
      const label = money(r.dollars);
      const next = list[i + 1];
      const end = a + Math.max(3, w);
      const room = (next ? x(next.first) : W + 80) - a - 4;
      if (room >= label.length * 6.6 + 6) s += `<span class="strip-label" style="left:${a}px;top:40px">${label}</span>`;
      else if (!next || x(next.first) - end > label.length * 6.6 + 10) s += `<span class="strip-label" style="left:${end + 4}px;top:31px">${label}</span>`;
    });
    return s;
  };
  const tall = opt.timeline === "lanes" ? 58 : LANE, rail = opt.timeline === "lanes" ? 54 : RAIL;
  const exec = byRole.find((r) => r.role === "executor"), rev = byRole.find((r) => r.role === "reviewer"), res = byRole.find((r) => r.role === "reserved");
  roleLane("orchestrator", "Orchestrator", "recorded role holds", roles.filter((r) => r.role === "orchestrator" && vis(r.from, r.to ?? END)).map((r) => segHtml(r.from, r.to ?? END, "resolved", r.by, "hold", 5, 24)).join(""));
  roleLane("executor", opt.timeline === "lanes" ? `Executor <span class="money">${money(exec.dollars)}</span>` : "Executor",
    opt.timeline === "lanes" && res ? `keen-swift-85</small><small>and ${money(res.dollars)} reserved, before its claim` : "keen-swift-85",
    stages.filter((s) => s.status === "in_progress" && vis(s.from, s.to ?? END)).map((s) => segHtml(s.from, s.to ?? END, "primary", `claimed ${took(s.to - s.from)}`, "", 5, 24)).join("") + strips("executor"), tall, rail);
  roleLane("reviewer", opt.timeline === "lanes" ? `Reviewer <span class="money">${money(rev.dollars)}</span>` : "Reviewer", "gilded-gecko-838", rounds.filter((r) => vis(r.from, r.to ?? END)).map((r) => {
    let h = segHtml(r.from, r.to ?? END, "question", "", view.focus && view.focusReview === r.round ? "focus" : "", 5, 24);
    const after = x(r.to ?? END) + 4;
    const next = rounds.find((n) => n.from > r.from);
    if (r.verdict && after < W + 60 && (!next || x(next.from) - after > 70)) h += `<span class="after" style="--c:var(--${r.verdict === "approved" ? "like" : "dislike"});left:${after}px;top:10px">${r.verdict}</span>`;
    return h;
  }).join("") + strips("reviewer"), tall, rail);
  laneHtml.push(`<div class="lane"><span class="name"><b>Board &amp; others</b></span><span class="track" style="height:${BOARD}px"><span class="rail" style="top:${BOARD / 2 + 4}px"></span>${markHtml(marksIn("other"), BOARD / 2 + 4)}</span></div>`);
  y += BOARD + 1;
  for (const [phase, name] of [["build", "Builds"], ["test", "Tests"]]) {
    const list = runs.filter((r) => r.phase === phase);
    const [placed, count] = rowsOf(list);
    const h = count * ROW + 8;
    const red = list.filter((r) => r.result === "red").length;
    let body = "";
    if (DATA.runs_from && DATA.runs_from > view.from) {
      const a = Math.max(0, x(view.from)), b = x(Math.min(DATA.runs_from, view.to));
      if (b > a) body += `<span class="notkept" style="left:${a}px;width:${b - a}px">${b - a > 210 ? `<span>not kept before ${day(DATA.runs_from)} ${clock(DATA.runs_from)}</span>` : ""}</span>`;
    }
    list.forEach((r, i) => {
      const from = r.started ?? r.queued, to = r.ended ?? END;
      if (!vis(from, to)) return;
      const [a, w] = clip(from, to);
      const text = w >= 30 ? esc(`${words(r)} · ${took(to - from)}`) : "";
      body += `<span class="run" style="--c:var(--${runTone(r)});left:${a}px;width:${w}px;top:${placed[i] * ROW + 6}px">${text}</span>`;
    });
    laneHtml.push(`<div class="lane"><span class="name"><b>${name}</b><small>${list.length} runs · ${red} red</small></span><span class="track" style="height:${h}px">${body}</span></div>`);
    y += h + 1;
  }
  laneHtml.push(`<div class="lane" style="border-bottom:0"><span class="name"><b>Gates</b></span><span class="track" style="height:20px"></span></div>`);
  y += 20;
  for (const g of gates) {
    let body = "";
    g.states.forEach((s, i) => {
      const to = g.states[i + 1]?.from ?? END;
      if (!vis(s.from, to)) return;
      const [a, w] = clip(s.from, to);
      body += `<span class="g ${s.state}" style="--c:var(--${s.state === "met" ? "like" : "question"});left:${a}px;width:${w}px"></span>`;
    });
    laneHtml.push(`<div class="gate"><span class="name">${g.name}</span><span class="track">${body}</span></div>`);
    y += 18;
  }
  const H = y;
  let over = "";
  for (const q of sc.skipped) {
    over += `<div class="brk" style="left:${152 + x(q.from)}px;width:${BREAK}px;top:22px;bottom:0;color:var(--muted-foreground)">${zigzag(H, "brk-l")}${zigzag(H, "brk-r")}<span>quiet · task done, nothing recorded</span></div>`;
  }
  // What a pointer resting on a part, or the focus on it, says of its cost.
  let chip = "";
  if (view.focusStage !== null && view.focusStage !== undefined) {
    // A stretch pointed at, tapped or focused: its time, its cost, whose calls and when they ran.
    const st = stages[view.focusStage], c = costOf(st), to = st.to ?? END;
    const ax = x(st.from);
    const who = c.rows.length > 1 ? c.rows.map((r) => `${roleOf(r)} ${money(r.dollars)}`).join(" · ") : roleOf(c.rows[0]);
    const text = `<b>${esc(stageWord(st)[0].toUpperCase() + stageWord(st).slice(1))}${st.status === "review" ? ` ${st.round}` : ""}, ${took(to - st.from)} ${money(c.dollars)}</b>, ${clock(st.from)}–${clock(to)}: ${who}, its model calls ${clock(c.first)}–${clock(c.last)}, ${amount(c.tokens)} tokens in ${c.calls} calls, estimated`;
    chip = `<span class="chip" style="left:${152 + ax}px;top:${tops.stage + LANE + 2}px;transform:translate(${ax > W - 460 ? "-100%" : "-12px"},0)">${text}</span>`;
  }
  if (view.focus) {
    const r = COST_ROUNDS.find((c) => c.n === view.focus);
    const anchorTop = opt.timeline === "row" ? tops.cost - 6 : tops.reviewer - 6;
    const ax = opt.timeline === "row" ? x(r.first) : x(rounds[r.n - 2].from);
    const text = `<b>${esc(r.long)}</b>, ${clock(r.first)}–${clock(r.last)}: <b>${money(r.dollars)}</b> (${roleSplit(r.roles)}), ${amount(r.tokens)} tokens in ${r.calls} calls, estimated`;
    chip = `<span class="chip" style="left:${152 + ax}px;top:${anchorTop}px;transform:translate(${ax > W - 420 ? "-100%" : "-12px"},-100%)">${text}</span>`;
  }
  const hours = `<div class="hours">${ticks.map((t) => `<span class="hour" style="left:${t.x}px"></span>`).join("")}</div>`;
  html += `<div class="lanes">${hours}${lanesHtml}${laneHtml.join("")}${over}${chip}</div>`;
  const costKey = opt.timeline === "row" ? `<li><i style="background:color-mix(in srgb,var(--cost) 22%,transparent);border:1px solid var(--cost)"></i>a round's cost, from its first model call to its last</li>`
    : opt.timeline === "lanes" ? `<li><i style="height:5px;background:var(--cost)"></i>a role's model calls in a round, first to last, and what they cost</li>`
    : opt.timeline === "after" ? `<li>$ after a stretch's time: what its role's model calls in that round cost, estimated</li>` : "";
  html += `<ul class="legend"><li><i style="background:color-mix(in srgb,var(--primary) 30%,transparent);border:1px solid var(--primary)"></i>worked or ran</li>${costKey}<li><i style="background:color-mix(in srgb,var(--like) 70%,transparent)"></i>green run</li><li><i style="background:color-mix(in srgb,var(--dislike) 70%,transparent)"></i>red run</li><li><i style="width:2px;height:8px;background:var(--muted-foreground)"></i>message</li><li><i style="background:var(--card);border-left:1px dashed var(--muted-foreground);border-right:1px dashed var(--muted-foreground);width:12px"></i>quiet stretch skipped</li><li><i style="background:none;border-top:4px solid var(--like);height:0"></i>gate met</li><li><i style="background:none;border-top:4px dotted var(--question);height:0"></i>gate missing</li>${opt.timeline === "words" ? "" : "<li>no build or test has a cost of its own: tokens are kept by session</li>"}</ul>`;
  app.innerHTML = `<p class="mock-note">${esc(said(opt))}: a mockup drawn from ${DATA.slug}'s recorded timeline and its recorded tokens, on the approved timeline (quiet stretches skipped). Costs are estimates at API list prices read ${COST.prices}. Nothing here is built.</p>
    <div class="top">${card(opt, false)}${foot(opt)}</div><h2>Timeline</h2><section class="panel">${html}</section>`;
}

// ---- The phone list ------------------------------------------------------------------------------
function phone(opt, view) {
  const rows = [];
  // C: a stage row carries what the role it names spent in that stage's round.
  const stageCost = (s) => {
    if (opt.timeline !== "lanes") return "";
    let parts = [];
    if (s.status === "in_progress") {
      const ends = rounds.findIndex((r) => Math.abs(r.from - s.to) < 1);
      const row = ROWS.find((r) => r.role === "executor" && r.round === ends + 1);
      if (row) parts.push(money(row.dollars));
    } else if (s.status === "review") {
      const row = ROWS.find((r) => r.role === "reviewer" && r.round === s.round + 1);
      if (row) parts.push(money(row.dollars));
      // The executor's work of a round with no in-progress stretch of its own: the fixes it made while the review ran.
      const own = ROWS.find((r) => r.role === "executor" && r.round === s.round + 1);
      const stretch = stages.find((t) => t.status === "in_progress" && rounds.some((r) => r.round === s.round + 1 && Math.abs(r.from - t.to) < 1));
      if (own && !stretch) parts.push(`+${money(own.dollars)}`);
    } else if (s.status === "ready") {
      const row = ROWS.find((r) => r.role === "reserved");
      if (row) parts.push(money(row.dollars));
    }
    return parts.length ? ` · <span class="money">${parts.join(" ")}</span>` : "";
  };
  // The cost after the time: a stage row's time, then its stretch's cost.
  const afterTime = (s) => {
    if (opt.timeline !== "after") return "";
    const c = costOf(s);
    return c ? ` ${money(c.dollars)}` : "";
  };
  for (const s of stages) {
    if (s.status === "done") { rows.push({ t: s.from, k: 0, html: `<li class="stage" style="--c:var(--like)"><span class="t">${clock(s.from)}</span><span class="dot"></span><span class="lbl">Done</span><span></span></li>` }); continue; }
    const name = s.status === "ready" ? "Ready" : s.status === "in_progress" ? "In progress · keen-swift-85" : `Review, round ${s.round} · gilded-gecko-838`;
    rows.push({ t: s.from, k: 0, html: `<li class="stage" style="--c:var(--${tone(s.status)})"><span class="t">${clock(s.from)}</span><span class="dot"></span><span class="lbl">${name}</span><span class="len">${took((s.to ?? END) - s.from)}${afterTime(s)}${stageCost(s)}</span><span></span><span></span><span class="pbar" style="width:${Math.min(100, 8 + ((s.to ?? END) - s.from) / 250)}%"></span></li>` });
  }
  for (const r of roles) if (r.role === "orchestrator") rows.push({ t: r.from, k: 1, html: `<li class="msg"><span class="t">${clock(r.from)}</span><span class="dia"></span><span class="lbl">Orchestrator: ${esc(r.by)}</span><span></span></li>` });
  for (const m of messages) rows.push({ t: m.at, k: 2, html: `<li class="msg"><span class="t">${clock(m.at)}</span><span class="dia"></span><span class="lbl">${esc(m.sender)} → ${esc(m.recipient ?? "Everyone on task")}</span><span></span></li>` });
  for (const r of runs) {
    const from = r.started ?? r.queued, to = r.ended ?? END;
    rows.push({ t: r.queued, k: 3, html: `<li><span class="t">${clock(r.queued)}</span><span class="dot" style="--c:var(--${runTone(r)});width:7px;height:7px"></span><span class="lbl">${esc(words(r))}</span><span class="len">${took(to - from)}${r.result === "red" ? ' <span class="red">red</span>' : ""}</span></li>` });
  }
  // B: a row for each round's cost, at its last model call.
  if (opt.timeline === "row") for (const r of COST_ROUNDS) rows.push({ t: r.last, k: 4, html: `<li class="cost"><span class="t">${clock(r.last)}</span><span class="coin">$</span><span class="lbl">Cost, ${esc(r.short)}</span><span class="len">${money(r.dollars)}</span></li>` });
  if (DATA.runs_from) rows.push({ t: DATA.runs_from - 0.01, k: 1, html: `<li class="kept"><span class="t">${clock(DATA.runs_from)}</span><span class="sw"></span><span class="lbl">Builds and tests kept from here on</span><span></span></li>` });
  for (const q of QUIET) rows.push({ t: q.from + 0.01, k: 0, html: `<li class="quiet"><span><b>${took(q.to - q.from)} quiet, ${clock(q.from)} → ${day(q.to)} ${clock(q.to)}</b><small>Task done. No role held, no run, message or change recorded.</small></span></li>` });
  rows.sort((a, b) => a.t - b.t || a.k - b.k);
  const out = [];
  let lastDay = null;
  for (const r of rows) {
    const d = day(r.t);
    if (d !== lastDay) { out.push(`<li class="day"><span class="t">${d}</span></li>`); lastDay = d; }
    out.push(r.html);
  }
  const top = head(opt, true);
  const foot = `<div class="pfoot"><span><i style="display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--primary);vertical-align:middle"></i> worked or ran</span>${view.all ? "" : `<button>Show all ${rows.length} steps</button>`}</div>`;
  const list = `<ul class="plist">${out.join("")}</ul>`;
  // The box keeps the room it gives its steps today (240 px less two lines of totals and the foot);
  // the cost's summary lines sit above them, and the box grows by their height.

  const box = view.all ? top + list + foot : `<div class="pbox">${top}<div class="pclip">${list}</div>${foot}</div>`;
  document.getElementById("app").innerHTML = `<p class="mock-note">${esc(said(opt))}: a mockup from ${DATA.slug}'s recorded timeline and tokens. Costs are estimates. Nothing here is built.</p>
    <div class="top">${card(opt, true)}</div><h2>Timeline</h2><section class="panel">${box}</section>`;
}

// ---- Views: #t the design, #a, #b, #c the first options, wide; -phone for a phone, -all its whole
// list; -zoom the second day's work; -focus a part pointed at --------------------------------------
function start() {
  const key = location.hash.slice(1) || "t";
  const [letter, ...rest] = key.split("-");
  const opt = OPTIONS[letter] ?? OPTIONS.t;
  const view = { from: START, to: END, all: rest.includes("all"), focus: null, focusReview: null, focusStage: null };
  if (rest.includes("zoom")) { view.from = rounds[2].from - 900; view.to = END; }
  if (rest.includes("focus")) {
    if (opt.timeline === "after") view.focusStage = stages.findIndex((s) => s.status === "review" && s.round === 5);
    else { view.focus = 4; view.focusReview = 3; }
  }
  if (rest.includes("phone")) { document.documentElement.classList.add("phone"); phone(opt, view); }
  else { document.documentElement.classList.remove("phone"); wide(opt, view); }
}
addEventListener("hashchange", start);
start();
</script>
