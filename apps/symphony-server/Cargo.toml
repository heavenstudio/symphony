[package]
name = "symphony-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# One native axum server per machine, with JSON contracts in symphony-api and the Dioxus shell at /.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
libc = "0.2"
symphony-api = { path = "../../crates/symphony-api" }
symphony = { path = "../../crates/symphony" }
# The plugins a host binary installs before it serves (`binary::run`).
symphony-plugin = { path = "../../crates/symphony-plugin" }
symphony-board = { path = "../../crates/tasks" }
# Its variables by their own names, the old ones still read (docs/analysis/sf-names.md#Variables).
symphony-env = { path = "../../crates/symphony-env" }
notify = "8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# A client file's gzip, made once per content and kept (`src/api/client/gzipped.rs`).
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
sha2.workspace = true
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# The one server hands each request to its project's router (`ServiceExt::oneshot`), as the
# router's own tests call it without a socket: axum is built on it.
tower = { version = "0.5", default-features = false, features = ["util"] }
