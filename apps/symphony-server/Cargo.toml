[package]
name = "symphony-server"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Symphony's server: one per machine, serving each registered project's documents, review queue and task board to its web client, which it embeds."
# README.md is this package's guide, which links into the repository: crates.io shows CRATE.md.
readme = "CRATE.md"
keywords = ["symphony", "server", "review", "tasks"]
categories = ["web-programming::http-server", "development-tools"]
# What crates.io gets: the sources, the build script, the client it embeds (client/public: the
# three builds the folder keeps, as they stand), the readme and the licence; never tests/ or
# fixtures, nor `symphony-shelf` (the browser tests' server). crates/symphony/tests/packages.rs
# holds its `.crate` within the 10 MiB crates.io takes.
include = [
    "src/**",
    "!src/bin/symphony-shelf.rs",
    "build.rs",
    "client/public/**",
    "CRATE.md",
    "LICENSE",
]

# One native axum server per machine, with JSON contracts in symphony-api and the client's shell at /.
[dependencies]
# `ws` answers the feed on a WebSocket, which holds none of a browser's six connections a host
# (`src/api/feed_socket.rs`).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
libc = "0.2"
symphony-api = { path = "../../crates/symphony-api", version = "=0.2.0" }
symphony = { package = "symphony-app", path = "../../crates/symphony", version = "=0.2.0" }
# The plugins a host binary installs before it serves (`binary::run`).
symphony-plugin = { path = "../../crates/symphony-plugin", version = "1.3.0" }
symphony-board = { path = "../../crates/tasks", version = "=0.2.0" }
# Its variables, each by its one SYMPHONY_ name.
symphony-env = { path = "../../crates/symphony-env", version = "1.0.0" }
notify = "8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# A client file's gzip, made once per content and kept (`src/api/client/gzipped.rs`).
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
sha2.workspace = true
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# The one server hands each request to its project's router (`ServiceExt::oneshot`), as the
# router's own tests call it without a socket: axum is built on it.
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
# The notice format the runner writes (`src/notices`), read back as a plugin reads it: that crate is
# not published, so its tests alone link it.
symphony-notice = { path = "../../crates/symphony-notice" }
# The board store's test fixture (src/testing.rs, tests/after_http.rs) waits for its server through
# the tests' wait (RULES.md `tests/no-test-fails-on-load`).
test-time = { path = "../../crates/test-time" }
# A paused runtime clock, so a drain's elapsed-time promise is read on time the test moves.
tokio = { version = "1", features = ["test-util"] }
# A sign-in service's stand-in signs the words the gate's tests send (`src/testing.rs`): the
# signature and the base64url the server verifies them with.
ed25519-dalek = { version = "3", default-features = false }
base64.workspace = true
# A WebSocket's client, for the feed on one (`src/api/feed_socket.rs`, tests/after_http.rs): the
# version and features axum's `ws` builds already.
tungstenite = "0.29"
