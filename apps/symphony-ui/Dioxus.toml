# dx's configuration for the Symphony client (dioxus-cli 0.7.10; apps/symphony-ui/bundle.sh runs it).
[application]
name = "symphony-ui"

[web]
# The server compresses what it sends; a .gz beside each file would only double the build.
pre_compress = false

[web.app]
title = "Symphony"
base_path = ""

[web.wasm_opt]
level = "z"
