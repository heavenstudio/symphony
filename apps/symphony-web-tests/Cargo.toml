# The web client's tests that need a browser or a real build (apps/symphony-web holds the client and
# its unit tests): `tests/browser` drives headless Chrome against the client's build, `tests/build`
# and `tests/client_release` hold its build and the check of the committed distribution. A package
# of its own, outside apps/symphony-web, so a test's edit never changes the client's key
# (tools/client-key.sh). It ships nothing.
[package]
name = "symphony-web-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
# The wire types the stand-in server answers with, and their fixtures.
symphony-api = { path = "../../crates/symphony-api" }
# Headless Chrome for tests/browser/, shared with `symphony shot`.
symphony-chrome = { path = "../../crates/chrome-devtools" }
# The variables the tests read (a client build), by their own names first.
symphony-env = { path = "../../crates/symphony-env" }
flate2 = "1"
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The browser tests' waits on a condition (RULES.md `tests/no-test-fails-on-load`).
test-time = { path = "../../crates/test-time" }
# The stand-in's WebSocket handshake for the feed (tests/browser/site.rs), as the Chrome driver
# builds it.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
