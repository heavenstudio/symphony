# Symphony as a Symphony project: what it would otherwise take from the generic defaults
# (crates/symphony/src/project.rs). It names no plugins and no [[entrypoints]]: any host serves it,
# and the convention serves docs/ at /docs/.

[project]
name = "Symphony"
id = "symphony"

[agents]
panes = "hc"
worktrees = "../symphony-wt"
launch = { default = "codex", model = "gpt-6.1-sol" }

[agents.models]
orchestrator = "gpt-6.1-sol"
assessor = "gpt-6.1-sol"

# What a generated branch passes before it lands with no reviewer: the check closest to the
# documents it changes. `just verify` is the release run's (docs/CHECKS.md).
[verdicts]
check = ["just", "symphony-cli", "docs-audit", "--check"]

# A land is its merge, its move and its push alone (docs/TASKS.md, the default landing): it runs
# no check (`check = false`; the docs audit is evidence at the tip, run on main's tip by the
# regenerator after each round, and part of the release run's `just verify`) and no generator. What
# the regenerator a land starts makes of main's newest tip
# (`just tasks regenerate`): the client distribution the server embeds, rebuilt and committed only
# when `just client-check` finds it differs from a fresh build, then checked again, and landed as
# one commit. Its key (`keys`, beside the generators, where a Symphony older than keys leaves it out
# and still reads this file) is the hash of the client's package
# (tools/client-key.sh): a tip whose key and committed distribution passed before builds nothing. Its outputs are the paths it owns: a land
# keeps main's side of them, so no branch's own distribution lands. The land pushes main to origin
# as its last step (`push`, on by default), and so does the regenerator.
[land]
check = false
generators = [
  { name = "the client distribution", outputs = "apps/symphony-server/client/public/", command = ["sh", "-c", "just client-check || { just client-update && just client-check; }"] },
]
keys = { "the client distribution" = ["tools/client-key.sh"] }

[board]
orchestrator_slots = 8
guide = "docs/TASKS.md"
# What a land starts once the task is closed, with its slug and merge appended: the release
# cadence, a release run once `[releases] every_landings` tasks have landed (docs/RELEASES.md). The
# count runs the build of `symphony-build` this checkout links, which any `just release` here links
# or renews (`tools/rs-bin.sh --link symphony-build` by hand), and builds nothing; a due run builds
# in its own checkout. The release run is `symphony-build`'s, a binary no project is given, never
# the shipped `symphony`'s.
on_land = [".target/bin/symphony-build", "release", "--due"]
# The machine's PostgreSQL, Homebrew's (`brew install postgresql@18`), whose `opt` link holds
# through its minor upgrades. Only a scratch board's server and its tests start it so far.
postgresql = "/opt/homebrew/opt/postgresql@18/bin"

# A release run every 20 landings, and a green release's refresh of the machine (docs/RELEASES.md).
[releases]
every_landings = 20
refresh = true
