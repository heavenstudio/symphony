# Symphony as a Symphony project: what it would otherwise take from the generic defaults
# (crates/symphony/src/project.rs). It names no plugins and no [[entrypoints]]: any host serves it,
# and the convention serves docs/ at /docs/.

[project]
name = "Symphony"
id = "symphony"

[agents]
panes = "hc"
worktrees = "../symphony-wt"
launch = { default = "claude", model = "opus" }

[agents.models]
reviewer = "opus"
executor = "opus"
orchestrator = "fable"
assessor = "haiku"

# What a generated branch passes before it lands with no reviewer: the check closest to the
# documents it changes. `just verify` is the release run's (docs/CHECKS.md).
[verdicts]
check = ["just", "symphony-cli", "docs-audit", "--check"]

# A land is delivered by a pull request on GitHub (docs/TASKS.md, a land delivered by a pull
# request): `delivery` runs the GitHub program linked beside the main checkout's own `tasks`
# (docs/GITHUB_SETUP.md; its settings are symphony-github.toml), which pushes the task's branch,
# writes its evidence as checks and has GitHub squash it into main, which the main checkout then
# follows. It runs no check of its own (`check = false`, which delivery requires; the docs audit is
# evidence at the tip, run on main's tip by the regenerator after each round, and part of the
# release run's `just verify`) and no generator. What the regenerator a land starts makes of
# main's newest tip (`just tasks regenerate`): the client distribution the server embeds, rebuilt
# only when `just client-check` finds it differs from a fresh build, then checked again, and filed
# as a task of its own that the orchestrator lands. Its key (`keys`, beside the generators, where
# a Symphony older than keys leaves it out and still reads this file) is the hash of the client's
# package (tools/client-key.sh): a tip whose key and committed distribution passed before builds
# nothing. Its outputs are the paths it owns: a land refuses a branch that changes them, so no
# branch's own distribution lands.
[land]
check = false
delivery = [".target/bin/symphony-github", "deliver"]
generators = [
  { name = "the client distribution", outputs = "apps/symphony-server/client/public/", command = ["sh", "-c", "just client-check || { just client-update && just client-check; }"] },
]
keys = { "the client distribution" = ["tools/client-key.sh"] }

[board]
orchestrator_slots = 8
guide = "docs/TASKS.md"
# What a land starts once the task is closed, with its slug and merge appended: the release
# cadence, a release run once `[releases] every_landings` tasks have landed (docs/RELEASES.md). The
# count runs the build of `symphony-build` this checkout links, which any `just release` here links
# or renews (`tools/rs-bin.sh --link symphony-build` by hand), and builds nothing; a due run builds
# in its own checkout. The release run is `symphony-build`'s, a binary no project is given, never
# the shipped `symphony`'s.
on_land = [".target/bin/symphony-build", "release", "--due"]
# PostgreSQL 18 or later is discovered on PATH; [board] postgresql can name an absolute bin
# folder instead (docs/PROJECT_FILE.md). Only scratch boards and their tests start it so far.

# A release run every 20 landings, and a green release's refresh of the machine (docs/RELEASES.md).
[releases]
every_landings = 20
refresh = true
