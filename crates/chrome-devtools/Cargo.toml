[package]
name = "chrome-devtools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Headless Chrome on a private profile, driven over its DevTools protocol, leashed to the process
# that launched it. The client's browser tests (apps/symphony-ui/tests/browser) and `symphony shot`
# (crates/symphony) share it; the tests' own fixtures and stand-ins stay in their test target, so the
# document CLI links only the driver.
[dependencies]
# The base64 of a captured picture (Page.captureScreenshot); tungstenite's own handshake uses it.
data-encoding = "2"
libc.workspace = true
serde_json.workspace = true
# The DevTools socket, plain ws:// to the loopback: no TLS, no async runtime.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
