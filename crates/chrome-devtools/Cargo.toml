# The package is `symphony-chrome` on crates.io, where `chrome-devtools` is another project's, and
# so is its library, `symphony_chrome`. The folder keeps its name.
[package]
name = "symphony-chrome"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Headless Chrome on a private profile, driven over its DevTools protocol and leashed to the process that launched it: what `symphony shot` and Symphony's browser tests drive."
readme = "README.md"
keywords = ["symphony", "chrome", "devtools", "headless", "screenshot"]
categories = ["development-tools::testing", "web-programming"]
# What crates.io gets: the sources (the descriptor closing script among them), the readme and the
# licence; never tests/ or fixtures.
include = ["src/**", "README.md", "LICENSE"]

# Headless Chrome on a private profile, driven over its DevTools protocol, leashed to the process
# that launched it. The client's browser tests (apps/symphony-web-tests/tests/browser) and `symphony shot`
# (crates/symphony) share it; the tests' own fixtures and stand-ins stay in their test target, so the
# document CLI links only the driver.
[dependencies]
# The base64 of a captured picture (Page.captureScreenshot); tungstenite's own handshake uses it.
data-encoding = "2"
libc.workspace = true
serde_json.workspace = true
# The feed's keep-alive event name, so a request counts the pings its stream delivered.
symphony-api = { path = "../symphony-api", version = "=0.2.0" }
# The Chrome and the leash's variable by their own names, the old ones still read.
symphony-env = { path = "../symphony-env", version = "1.0.0" }
# The DevTools socket, plain ws:// to the loopback: no TLS, no async runtime. The version axum's
# `ws` builds, so the server, which links both, links one: they move together.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
# The tests' own waits (`test_time::backstop`) keep the driver's backstop rule: one test ties the two.
test-time = { path = "../test-time" }
