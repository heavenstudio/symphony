# The package is `symphony-app` on crates.io, where `symphony` is another project's; its library
# keeps the name `symphony`, so a dependent writes `symphony = { package = "symphony-app", … }` and
# every `symphony::` stays as it is. The binaries keep theirs: `symphony` is what is installed.
[package]
name = "symphony-app"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Symphony's library and its `symphony` command: the owner's review of a project's documents, its decisions and asks, the project file and the plugins it selects."
readme = "README.md"
keywords = ["symphony", "review", "documentation", "cli"]
categories = ["command-line-utilities", "development-tools"]
# What crates.io gets: the sources, the build script, what `symphony init` installs (shipped/), the
# readme and the licence; never tests/, nor `symphony-test-plugin` (the seam tests' plugin). This
# repository's own build and release commands are a package of their own (crates/symphony-build),
# which this one never compiles.
include = [
    "src/**",
    "!src/bin/symphony-test-plugin.rs",
    "build.rs",
    "shipped/**",
    "README.md",
    "LICENSE",
]

[lib]
name = "symphony"

# The Symphony library: the cards and callouts the owner leaves in docs/, read and written in the shapes
# docs/workflow/REVIEW.md sets down. `symphony status` is `just symphony-status`, `symphony reply` is
# `just symphony-reply`, and `symphony ask` is `just symphony-ask`.
# `symphony serve` retains the line-oriented JSON command interface. The product's packages
# (this one, symphony-board, symphony-chrome, symphony-server and symphony-api) carry one version
# and name each other exactly (`=`); the plugin kit and the helpers by their own lines (`^`).
[dependencies]
# The register's patterns (leftmost-first, like Python's re).
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: an object keeps its members in the order its file wrote them, so a schema check
# names them in that order (`schema`).
# arbitrary_precision: integer tokens keep their type and value beyond the machine's integer range.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# A heading's anchor folds accents the way Python-Markdown's toc does: NFKD, then ASCII.
unicode-normalization = "0.1"
# The local time a tidy and a verdict stamp, as Python's datetime.now() reads it (localtime_r).
libc = "0.2"
# The documents as data (`render`, `tree`): markdown to HTML with comrak (no syntax highlighter, no CLI),
# the lookaround patterns of the tree and the links with fancy-regex, a section's hash and a picture's token with sha2.
comrak.workspace = true
fancy-regex.workspace = true
sha2.workspace = true
symphony-schema = { path = "../symphony-schema", version = "1.0.0" }
symphony-args = { path = "../symphony-args", version = "1.0.0" }
symphony-api = { path = "../symphony-api", version = "=0.2.0" }
# The plugin seams a project's plugins implement, and the project file (symphony.toml) they are chosen by.
symphony-plugin = { path = "../symphony-plugin", version = "1.3.0" }
# The one reading of a card and its entries, which the docs build shares (`register`).
symphony-docs = { path = "../symphony-docs", version = "1.3.0" }
# Its variables, each by its one SYMPHONY_ name.
symphony-env = { path = "../symphony-env", version = "1.0.0" }
# The signed word a sign-in service in front of the server sends (`signed_in`): its Ed25519
# signature, the board's own version (its guards verify with it), and its base64url parts.
ed25519-dalek = { version = "3", default-features = false }
base64.workspace = true
toml.workspace = true
symphony-board = { path = "../tasks", version = "=0.2.0" }
# `symphony shot`: a page in a private headless Chrome, driven as the client's browser tests drive it.
symphony-chrome = { path = "../chrome-devtools", version = "=0.2.0" }
gix = { version = "0.87", default-features = false, features = ["basic", "blob-diff", "revision", "sha1"] }

[dev-dependencies]
# The notice format the server writes (`notices`), read back by the crate a plugin takes it with:
# that crate is not published, so this one writes the format and its tests hold the two the same.
symphony-notice = { path = "../symphony-notice" }
# The board the verdicts' and asks' tests run on is the store's own test server (PostgreSQL, one
# per test binary), a database of its own per test: tests/picks/main.rs and the other fixtures take
# the store's tests' common file, which waits for its server through the tests' wait (RULES.md
# `tests/no-test-fails-on-load`).
test-time = { path = "../test-time" }
