# The docs checks every Symphony project's docs build runs, and the Markdown syntax every reader of
# the docs shares. Std only, so a build script links it without the Symphony library.
[package]
name = "symphony-docs"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The checks a Symphony project's docs build runs over its documents, and the Markdown syntax every reader of them shares. Part of Symphony's plugin kit."
readme = "README.md"
keywords = ["symphony", "markdown", "docs", "plugin"]
categories = ["text-processing", "development-tools"]
# What crates.io gets: the sources, the readme and the licence; never tests/ or fixtures.
include = ["src/**", "README.md", "LICENSE"]

[lints]
workspace = true
