# What a Symphony plugin implements: the traits of each seam, and the block vocabulary of
# symphony-blocks it renders to. Data in, data out, so a sidecar adapter can implement a trait later.
# With symphony-blocks and symphony-docs it is the plugin kit, which depends on no other workspace
# crate.
[package]
name = "symphony-plugin"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "What a Symphony plugin implements: its seams, the blocks it renders to and the line protocol a plugin's own process answers. Part of Symphony's plugin kit."
readme = "README.md"
keywords = ["symphony", "plugin", "protocol"]
categories = ["development-tools"]
# What crates.io gets: the sources, the readme and the licence; never tests/ or fixtures.
include = ["src/**", "README.md", "LICENSE"]

# A first plugin, whole, which docs/engineering/PLUGIN_WRITING.md walks through: built and tested with the
# workspace so the page's code cannot go stale, and outside `include`, so not in the package.
[[example]]
name = "hello"
test = true

[dependencies]
# The block vocabulary a plugin renders to and the data its seams return (`vocabulary`).
symphony-blocks = { path = "../symphony-blocks", version = "1.1.0" }
# The docs checks' trait and the reading of a project's docs/ it is given.
symphony-docs = { path = "../symphony-docs", version = "1.1.0" }
# The protocol's requests and answers (`protocol`): each seam's call as serde data.
serde = { version = "1", features = ["derive"] }
# The protocol's lines, written and read by a plugin's process (`serve`) and its host: a line's
# request and answer kept raw until its id names the call (`raw_value`), and a fraction read back to
# the number the other side wrote (`float_roundtrip`), as the server reads it.
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }

[dev-dependencies]
# The features the server's build unifies on serde_json, so the protocol's tests read and write JSON
# as the server does (docs/workflow/CHECKS.md): above all `arbitrary_precision`, under which serde's buffered
# content loses a fraction. A dev-dependency's features never reach a plugin's build.
serde_json = { workspace = true, features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }
# The tests' waits on a condition, whose backstop only a stall reaches (RULES.md
# `tests/no-test-fails-on-load`); published without it, as it names no version.
test-time = { path = "../test-time" }
