# The plugin kit's block vocabulary: the content a plugin renders to and the data its seams return,
# as the server sends them and the client draws them. Serde only, so one definition builds for the
# server, a plugin and the client; it depends on no other workspace crate.
[package]
name = "symphony-blocks"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The blocks a Symphony plugin renders to and the data its seams return, as the server sends them and the client draws them. Part of Symphony's plugin kit."
readme = "README.md"
keywords = ["symphony", "plugin", "blocks", "serde"]
categories = ["development-tools", "encoding"]
# What crates.io gets: the sources, the readme and the licence; never tests/ or fixtures.
include = ["src/**", "README.md", "LICENSE"]

[features]
# The TypeScript declarations of the types the web client reads (ts-rs's derive), which
# symphony-api's own `typescript` feature turns on for the client's generated wire types. Off for
# every build that runs: nothing it compiles is in the server, a plugin or a client.
typescript = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
# The features the server's build unifies on serde_json (docs/workflow/CHECKS.md), so this package's own tests
# read and write JSON as the server does: above all `arbitrary_precision`, whose number a board
# field's value reads. A dev-dependency's features never reach the client or a plugin's build.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }

[lints]
workspace = true
