# The plugin kit's block vocabulary: the content a plugin renders to and the data its seams return,
# as the server sends them and the client draws them. Serde only, so one definition builds for the
# server, a plugin and the wasm client; it depends on no other workspace crate.
[package]
name = "symphony-blocks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The features the server's build unifies on serde_json (docs/CHECKS.md), so this package's own tests
# read and write JSON as the server does: above all `arbitrary_precision`, whose number a board
# field's value reads. A dev-dependency's features never reach the client or a plugin's build.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }

[lints]
workspace = true
