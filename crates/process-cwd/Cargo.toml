[package]
name = "process-cwd"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Working-directory scans of running processes through lsof, and children started without a fork, as Symphony's sweeps use them."
readme = "README.md"
keywords = ["process", "cwd", "lsof", "spawn"]
categories = ["os::unix-apis"]
# What crates.io gets: the sources, the readme and the licence; never tests/ or fixtures.
include = ["src/**", "README.md", "LICENSE"]

# One bounded OS scan for both sweeps, without linking the board into the cargo wrapper.
[dependencies]
libc.workspace = true

[dev-dependencies]
# The tests' waits and their backstop (RULES.md `tests/no-test-fails-on-load`).
test-time = { path = "../test-time" }
