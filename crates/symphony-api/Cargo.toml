# The Symphony's wire types: the JSON apps/symphony-server sends and apps/symphony-web reads.
# serde only: the server builds them, and the client reads them generated as TypeScript.
[package]
name = "symphony-api"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Symphony's wire types: the JSON its server sends and its client reads, the blocks of symphony-blocks among them."
readme = "README.md"
keywords = ["symphony", "serde", "api"]
categories = ["web-programming", "encoding"]
# What crates.io gets: the sources, the readme and the licence; never tests/ or fixtures.
include = ["src/**", "README.md", "LICENSE"]

[features]
# The TypeScript declarations of the types the web client reads (ts-rs's derive), and the example
# that writes them into apps/symphony-web/src/wire.ts (`just client-wire`) or checks that file
# against them (`just client-lint`). Off for every build that runs.
typescript = ["dep:ts-rs", "symphony-blocks/typescript"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# The plugin kit's block vocabulary, which these types carry: re-exported under the names it has here.
symphony-blocks = { path = "../symphony-blocks", version = "1.3.0" }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
repository-read = { path = "../repository-read" }
# The features the server's build unifies on serde_json (symphony-board asks for all four, crates/symphony
# and crates/symphony-schema for arbitrary_precision and preserve_order, axum for raw_value), so this
# package's own tests read and write JSON as the server, the `tasks` binary and the workspace's run do
# (docs/workflow/CHECKS.md). A dev-dependency, as this package links no serde_json of its own: the client, which
# links it, reads the wire without serde_json's parser, and a dev-dependency's features never reach it.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }

[lints]
workspace = true

# The web client's wire types (apps/symphony-web/src/wire.ts), printed from these types; its own
# tests run when it is named with the feature on (`cargo test -p symphony-api --features typescript
# --example typescript`, which `just client-lint` runs). Never `test = true`: the release run's
# units lane (tools/test-lanes.sh) would name it without the feature, which cargo refuses.
[[example]]
name = "typescript"
required-features = ["typescript"]
