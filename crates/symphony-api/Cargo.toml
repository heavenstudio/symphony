# The Symphony's wire types: the JSON apps/symphony-server sends and apps/symphony-ui reads.
# serde only, so the server and the wasm client build the same types.
[package]
name = "symphony-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
repository-read = { path = "../repository-read" }
# The features the server's build unifies on serde_json (crates/symphony and crates/symphony-schema ask
# for arbitrary_precision and preserve_order, symphony-board for float_roundtrip, axum for raw_value), so
# this package's own tests read and write JSON as the server and the workspace's run do
# (docs/CHECKS.md). A dev-dependency's features reach test builds alone, never the client's.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }

[lints]
workspace = true
