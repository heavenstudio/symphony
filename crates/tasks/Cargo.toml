[package]
name = "symphony-board"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# SurrealDB is the owner's choice for the board (card tasks-store-engine, 2026-10-06 22:09: "B. we need a
# server anyway (just symphony), server should start the db"). It is reached over its JSON-RPC on plain HTTP
# (src/rpc.rs) rather than through the `surrealdb` client crate: serde and serde_json are already in that
# crate's own tree, and the rest of it (tokio, the WebSocket stack) is ~260 CPU-s of build this does
# without (docs/engineering/analysis/review-app-rust-port.md, "Clean release build").
[dependencies]
process-cwd = { path = "../process-cwd" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a time in a dump reads as exactly the float Python wrote, not one ulp off.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The SQLite board the move reads and freezes (src/cutover.rs). The owner, 2026-10-08: "No python code
# should be ran at this point, complete the migration first", and "all python code needs migrated to be
# migrated to rust". Bundled, so the SQLite it links is the one pinned here on every machine, not the
# system's; no default features (the statement cache and the wasm build).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# The project file's `[project] id`, which names the SQLite board the move reads (src/cutover.rs).
toml.workspace = true
# Local meaning search, approved by tasks-search-embedding-model (A, 2026-10-29).
tokenizers.workspace = true
tract-onnx.workspace = true
tract-linalg.workspace = true
sha2.workspace = true

[dev-dependencies]
libc = "0.2"
