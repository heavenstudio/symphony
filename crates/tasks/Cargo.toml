[package]
name = "symphony-board"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Symphony's task board: the `tasks` and `agent-send` commands, its store on SurrealDB, the agents it staffs and the builds and tests it records."
readme = "README.md"
keywords = ["symphony", "tasks", "board", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
# What crates.io gets: the sources, the build script, the readme and the licence; never tests/,
# fixtures or examples, nor `fake-hc`, the tests' stand-in for the terminals the board drives.
include = ["src/**", "!src/bin/fake-hc.rs", "build.rs", "README.md", "LICENSE"]

# SurrealDB is the board's database: a server runs anyway (`just symphony`), and the server starts
# the database. It is reached over its JSON-RPC on plain HTTP
# (src/rpc.rs) rather than through the `surrealdb` client crate: serde and serde_json are already in that
# crate's own tree, and the rest of it (tokio, the WebSocket stack) is ~260 CPU-s of build this does
# without (docs/engineering/analysis/review-app-rust-port.md, "Clean release build").
[dependencies]
process-cwd = { path = "../process-cwd", version = "1.0.1" }
# Its variables, each by its one SYMPHONY_ name.
symphony-env = { path = "../symphony-env", version = "1.0.0" }
# The command a mistyped word was nearest to, shared with the `symphony` command line.
symphony-args = { path = "../symphony-args", version = "1.0.0" }
# The run line the recorder appends to the day files (src/runs.rs), the type the Runs page reads.
symphony-api = { path = "../symphony-api", version = "=0.2.0" }
# A card and the owner's lines under it, read as the Symphony reads them: the owner's answers a
# worktree holds that no commit has, which the sweep keeps and a land refuses (src/sweep/git/owner.rs).
symphony-docs = { path = "../symphony-docs", version = "1.1.0" }
# The execution adapter contract (`symphony_plugin::execution`) whose attempts the board keeps
# (src/execution.rs): the kit's types and its bounded `invoke`, never a provider's client; and the
# trusted principal a workflow operation is admitted for (`Principal`, src/workflow.rs).
symphony-plugin = { path = "../symphony-plugin", version = "1.1.0" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a time in a dump reads as exactly the float Python wrote, not one ulp off. The other
# three are the features the server's build unifies on serde_json (crates/symphony and
# crates/symphony-schema ask for arbitrary_precision and preserve_order, axum for raw_value), asked for
# here so the `tasks` binary, the server's board and this package's own tests are one configuration
# (docs/CHECKS.md), and a worktree's board tests reuse the dependencies the main checkout's build of
# `tasks` compiled.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order", "raw_value"] }
# The project file: `[project] id` (src/project.rs), and `[board] on_review`, the command a task
# moving to review starts (src/on_review.rs).
toml.workspace = true
sha2.workspace = true
# The check of a workflow guard's attestation and an approval authority's observation: an Ed25519
# signature by the key the project commits in `[[workflow_authorities]]` (src/workflow/guard.rs).
# No default features: verification alone, no key generation, no random source, no serde of keys;
# `verify_strict` refuses weak keys and malleable signatures. It shares sha2 0.11 with this package.
ed25519-dalek = { version = "3", default-features = false }
# `tasks run` becomes the command it records and watches it from a process of its own, where it
# cannot, runs it as a child (src/cli/recorder.rs); the machine id is read without following a link;
# the free disk the board warns of is read by `statvfs` (src/board_health/disk.rs).
libc.workspace = true
# The hosted board's driver, linked by the `hosted-postgresql` feature alone (src/pg/hosted.rs;
# docs/analysis/hosted-postgresql.md says why this one): PostgreSQL's protocol and SCRAM from
# tokio-postgres, TLS from rustls, which verifies the chain and the name or does not connect, with
# ring's primitives and no system library. tokio drives each pool's connections on one thread.
tokio = { version = "1", features = ["rt", "time", "net", "sync"], optional = true }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"], optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
# A board in a managed PostgreSQL reached over verified TLS (src/pg/hosted.rs,
# docs/POSTGRESQL.md): off unless a hosted build asks for it, so no other build links its driver.
hosted-postgresql = ["dep:tokio", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls"]

# The hosted board against real PostgreSQL 16 and 18 servers (tests/hosted/main.rs).
[[test]]
name = "hosted"
path = "tests/hosted/main.rs"
required-features = ["hosted-postgresql"]

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
# The CPU a test bills and its waits on a condition (RULES.md `tests/no-test-fails-on-load`).
test-time = { path = "../test-time" }
