# How clippy reads the workspace lints (Cargo.toml, `[workspace.lints.clippy]`). Only what differs from
# clippy's defaults is here.

# A lint may ask for a change to a `pub` signature. Not every caller is in this tree: consuming
# projects pin some of these packages by git and call a few hundred of their names. The
# `tests/consumer_api.rs` guards (docs/workflow/RELEASES.md, step 4), which this same lint compiles, hold
# most of those names by signature, each coerced to its fn pointer type, and some by a call
# written as a consumer writes it: a lint-driven change to a signature so held fails the gate
# wherever it would break the consumer's code, and the name keeps its signature under an
# `#[expect(clippy::..., reason = "a consumer calls it")]`.
# The signature of a function a guard names alone, and what no guard names, is the consuming
# project's to meet when it moves its pin, its own gate building it on the new one. `true` would
# instead exempt every exported item of every package from the lints this setting governs, where
# the workspace has some two thousand `pub fn`s and nearly all of them only this tree calls.
avoid-breaking-exported-api = false

# A test asserts: its `unwrap()` and `panic!` are the assertion, and it may print what it saw.
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Names `doc_markdown` would otherwise want in backticks: the products and formats the docs name as
# words. `..` keeps clippy's own list (JavaScript, GitHub, macOS and the rest).
doc-valid-idents = ["SurrealDB", "SQLite", "GDScript", "CBOR", "WhatsApp", ".."]

# No code waits a length of time and then looks or acts (RULES.md `code/no-timed-waits`): it waits
# for the thing itself (a message, a signal, a child's end, a watcher's event) and acts at once. A
# number only paces a named helper, which says so in an `#[expect]` of its own, and a site kept
# until it is converted says why in `#[expect(clippy::disallowed_methods, reason = "no-timed-waits
# baseline: ...")]`, which fails once the site is gone. A deadline that only bounds a wait for an
# event (`recv_timeout`, `Condvar::wait_timeout`, `thread::park_timeout`, `tokio::time::timeout`) is
# not listed. Tables, not one array, so a crate's own clippy.toml (crates/tasks', crates/symphony's,
# apps/symphony-server's) adds its own after this file whole, which
# crates/symphony/src/channel_tests.rs holds each to.
[[disallowed-methods]]
path = "std::thread::sleep"
reason = "RULES.md code/no-timed-waits: wait for the event itself, or pace it by a named helper (test_time::wait::until in a test)"

[[disallowed-methods]]
path = "std::thread::sleep_ms"
reason = "RULES.md code/no-timed-waits: wait for the event itself, or pace it by a named helper (test_time::wait::until in a test)"

[[disallowed-methods]]
path = "tokio::time::sleep"
reason = "RULES.md code/no-timed-waits: wait for the event itself, or pace it by a named helper (test_time::wait::until in a test)"

[[disallowed-methods]]
path = "tokio::time::sleep_until"
reason = "RULES.md code/no-timed-waits: wait for the event itself, or pace it by a named helper (test_time::wait::until in a test)"

[[disallowed-methods]]
path = "tokio::time::interval"
reason = "RULES.md code/no-timed-waits: wait for the event itself, or pace it by a named helper (test_time::wait::until in a test)"

[[disallowed-methods]]
path = "tokio::time::interval_at"
reason = "RULES.md code/no-timed-waits: wait for the event itself, or pace it by a named helper (test_time::wait::until in a test)"

# The board's own, below the workspace's settings above. Clippy reads the nearest clippy.toml alone,
# so this crate's starts with symphony/clippy.toml whole (src/sys.rs's tests hold it to that).
#
# Every child the board starts is built by `sys::command` or `sys::command_with` (src/sys.rs), without
# the session of the process that starts it (`sys::SESSION_VARS`). Clippy refuses any other
# constructor, however its path is spelled, imported or renamed. A test target, or a library test
# module, starts what it likes through tests/support/children.rs (`Command::of`, `.cleared()`),
# whose constructors alone carry `#[expect(clippy::disallowed_methods, reason = "...")]`, so
# clippy still reads every test against the timers above.
[[disallowed-methods]]
path = "std::process::Command::new"
reason = "a board child starts without its starter's session: sys::command, or sys::command_with in a caller's environment"

[[disallowed-methods]]
path = "process_cwd::spawn::Command::new"
reason = "a board child starts without its starter's session: sys::command, or sys::command_with in a caller's environment"

[[disallowed-methods]]
path = "std::process::Command::env_clear"
reason = "a child in a caller's environment is sys::command_with's, which keeps none of the session"

[[disallowed-methods]]
path = "process_cwd::spawn::Command::env_clear"
reason = "a child in a caller's environment is sys::command_with's, which keeps none of the session"

[[disallowed-methods]]
path = "process_cwd::process_cwds"
reason = "its lsof keeps the starter's session: process_cwd::process_cwds_with(sys::command(\"lsof\"))"

[[disallowed-methods]]
path = "process_cwd::occupied"
reason = "its lsof keeps the starter's session: process_cwd::occupied_with(sys::command(\"lsof\"), tree)"

# A poisoned lock is taken through `lock::Recovered` alone (src/lock.rs), whose one use of
# `PoisonError::into_inner` carries its `#[expect]`. Clippy refuses any other, named as a path
# (`unwrap_or_else(PoisonError::into_inner)`) or called on the error. The workspace's clippy.toml
# cannot say it: the crates that cannot take the board's `Recovered` read that file too.
[[disallowed-methods]]
path = "std::sync::PoisonError::into_inner"
reason = "a poisoned lock is recovered through symphony_board::lock::Recovered: `.lock().recover()`"

# A channel the board's code makes is `crate::channel`'s (src/channel.rs): std's is compiled whole for
# each item type it carries, 5 to 16 KB of a binary a type, and carried boxed every type shares one.
# Clippy refuses std's two constructors. A test or a load example makes std's through
# tests/support/test_channel.rs (`test_channel::channel`), whose one use carries its `#[expect]`, as
# neither holds a size line.
[[disallowed-methods]]
path = "std::sync::mpsc::channel"
reason = "a channel of the board's code is crate::channel's, which every item type shares; a test's or an example's is test_channel::channel"

[[disallowed-methods]]
path = "std::sync::mpsc::sync_channel"
reason = "a channel of the board's code is crate::channel's, which every item type shares; a test's or an example's is test_channel::channel"

# A sort of the board's code is `crate::order`'s (src/order.rs, RULES.md `code/shared-sorter`):
# std's is compiled whole for each element type and comparison, about 4 KB of a binary each, and
# the shared one once. Clippy refuses std's seven slice sorts, called as a method, by path or as a
# function. A busy board path keeps std's in-place sort, as order.rs keeps its one, each under an
# `#[expect(clippy::disallowed_methods, reason = "...")]` naming it; a test or a load example sorts
# through the shared one, but where it measures that one against std's.
[[disallowed-methods]]
path = "slice::sort"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"

[[disallowed-methods]]
path = "slice::sort_by"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"

[[disallowed-methods]]
path = "slice::sort_by_key"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"

[[disallowed-methods]]
path = "slice::sort_by_cached_key"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"

[[disallowed-methods]]
path = "slice::sort_unstable"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"

[[disallowed-methods]]
path = "slice::sort_unstable_by"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"

[[disallowed-methods]]
path = "slice::sort_unstable_by_key"
reason = "RULES.md code/shared-sorter: sort through symphony_board::order (sort_by, sort_by_key), compiled once; a busy board path keeps std's under an #[expect] naming it"
