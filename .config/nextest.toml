# tools/nextest.sh also checks the exact version before any build or test starts.
nextest-version = "0.9.152"

[profile.release]
retries = 0
fail-fast = false
test-threads = 6
status-level = "pass"
final-status-level = "fail"
# A per-case stall backstop. Slow cases report once a minute before termination.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "10s" }

[test-groups.chrome]
max-threads = 2

[test-groups.database]
max-threads = 2

[[profile.release.overrides]]
filter = 'binary(browser) | package(symphony-chrome)'
test-group = 'chrome'

[[profile.release.overrides]]
filter = 'package(symphony-board) | binary(release) | binary(after_lifecycle) | binary(after_reload)'
test-group = 'database'
