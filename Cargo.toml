# Symphony's workspace: server, client, review library, its own build and release commands, wire types, docs checks, plugin seams, board, optional GitHub issue exchange, OS scanner, headless Chrome driver and the tests' time.
[workspace]
resolver = "3"
members = ["apps/symphony-desktop", "apps/symphony-server", "apps/symphony-web-tests", "crates/chrome-devtools", "crates/process-cwd", "crates/repository-read", "crates/symphony", "crates/symphony-api", "crates/symphony-args", "crates/symphony-blocks", "crates/symphony-build", "crates/symphony-docs", "crates/symphony-env", "crates/symphony-github", "crates/symphony-notice", "crates/symphony-plugin", "crates/symphony-schema", "crates/tasks", "crates/test-time"]

# What every member inherits. `publish = false` keeps a member off crates.io unless its own
# manifest says `publish = true` with the metadata crates.io shows (docs/workflow/RELEASES.md, "Packages on
# crates.io"; crates/symphony/tests/packages.rs holds which members those are).
[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
authors = ["Stefano Benatti"]
repository = "https://github.com/heavenstudio/symphony"

# Tests and clippy use line tables for panic backtraces without full debug info or incremental
# caches in each tree's build folder. The board launcher builds release binaries separately.
[profile.dev]
debug = "line-tables-only"
incremental = false

# What `cargo install` builds the shipped binaries with, each held to its line in
# tools/size-budget.toml (docs/workflow/CHECKS.md, "Size budgets"). `strip = true` leaves out the symbol
# table, 18 to 26 % of each binary. A panic still prints its thread, file:line:col and message,
# but a backtrace names nothing: RUST_BACKTRACE=1 prints no frames and `full` raw addresses, and
# no unstripped copy is kept to read them against. A build to debug or profile sets
# CARGO_PROFILE_RELEASE_STRIP=debuginfo, which keeps the names. Unwinding stays: the server
# outlives a plugin's panic (symphony::gates) and a worker's.
#
# `codegen-units = 1` compiles each crate as one unit. In the default 16 a crate compiles a generic
# or helper into each unit that reaches it, with its unwind tables, inlines across none of them, and
# copies a large constant table (comrak's, regex-syntax's Unicode tables) into each unit that reads
# it: one unit saves about 2.7 MB of symphony-server, 1.8 MB of symphony, 2.4 MB of tasks and
# 0.5 MB of agent-send. It costs each crate's release compile (a cold release build about 30 %
# longer); debug and test builds are unchanged.
[profile.release]
strip = true
codegen-units = 1

# Optimise the regular-expression dependencies in development and test builds too.
[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# Every outside crate once, with its version, so the whole workspace resolves to one version of each
# and a member says only `name.workspace = true` (plus the features it needs). A caret version takes
# the newest compatible release Cargo.lock has resolved; `--locked` keeps every build on the lockfile.
# A new crate here is a dependency the owner's ask has to cover (AGENTS.md, "Boundaries").
[workspace.dependencies]
comrak = { version = "0.57", default-features = false }
fancy-regex = "0.19"
# The JSON Schema check of the settings files (draft 2020-12): a maintained validator, not our own
# (docs/engineering/analysis/python-zero.md, "A maintained crate instead of our code"). No default
# features: a schema's `$ref` resolves inside the schema alone, nothing is fetched over HTTP or read
# from disk by the crate.
jsonschema = { version = "0.59", default-features = false }
libc = "0.2"
regex = "1"
serde_json = "1"
sha2 = "0.11"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# The wire types' TypeScript declarations, for the web client (apps/symphony-web/src/wire.ts): the
# derive behind the `typescript` feature of symphony-api and symphony-blocks, which only the
# generator turns on. serde-compat (its default) reads the types' serde attributes; it says
# nothing of the one it cannot read, `#[serde(other)]` (a word a newer server sends read as a known
# variant), which it leaves to the client's guards, as its declaration names that variant all the same.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

# The lints every member inherits. `just lint-rs` runs clippy with `-D warnings`, so each `warn` below
# is red at the gate and a warning in a plain build; `forbid` is for the few that no `expect` may
# switch off. A lint is answered by fixing the code; where the code is right and the lint is not,
# `#[expect(lint, reason = "...")]` on that item says why, and goes red itself once the lint no longer
# fires (allow_attributes, allow_attributes_without_reason below).
[workspace.lints.rust]
# Identifiers are ASCII; strings and comments may say ❌ and ✅ as the gates do.
non_ascii_idents = "forbid"
# The 2018 idioms that 2024 still only recommends: no bare trait objects, every elided lifetime
# written as `'_`, no `extern crate`.
rust_2018_idioms = { level = "warn", priority = -1 }
# `pub` means exported from the crate; what only the crate reaches is `pub(crate)`, so the public
# API is exactly what reads `pub` (crates/AGENTS.md, "The public API").
unreachable_pub = "warn"
# A public type must be nameable by its users: no `pub fn` returning a type from a private module.
unnameable_types = "warn"
# A path is written once as it is imported, not both `fmt::Result` and `std::fmt::Result`.
unused_qualifications = "warn"
# A cast that changes nothing, or a numeric cast between the same type, hides an intent that is not there.
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# Lifetimes and macro rules nothing uses are left-overs of an edit.
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_macro_rules = "warn"
unused_import_braces = "warn"
# A macro's metavariable used without being matched, or matched without use, is a macro that is wrong.
meta_variable_misuse = "warn"
# `#[macro_use] extern crate` is the 2015 way; `use crate::name` is the one written here.
macro_use_extern_crate = "warn"
# `unsafe` is confined (tools/rust-style-audit, 2026-11-04: 354 unsafe blocks in 90 files, none confined, 48
# without a SAFETY comment). A crate with no unsafe code forbids it at every root (`#![forbid(unsafe_code)]`);
# the one module or item that needs it carries `#[expect(unsafe_code, reason = "...")]`, which goes red once
# the unsafe code leaves, so the set only shrinks. A member reads this through `[lints] workspace = true`.
unsafe_code = "deny"

[workspace.lints.clippy]
# `clippy::all` (correctness, suspicious, style, complexity, perf) is on by default. Pedantic is on
# too, as a group so a new pedantic lint arrives with the toolchain; the five allowed below are the
# ones that would ask for noise rather than care.
pedantic = { level = "warn", priority = -1 }
# A `Result`'s own `Error` type says what can fail; an `# Errors` section on every fallible function
# would restate it. Same for `# Panics`: a panic is an invariant, named in its `expect` message.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `#[must_use]` goes on the few values a caller must not drop (a guard, a verdict), not on every pure
# function.
must_use_candidate = "allow"
# axum handlers are `async` by their signatures whether or not they await.
unused_async = "allow"
# A `HashMap` parameter generic over its hasher is a library's concern; nothing here swaps hashers.
implicit_hasher = "allow"
# `similar_names` flags `addr` beside `add`; the names here are words, and the reviewer reads them.
similar_names = "allow"

# From the restriction group, each chosen for a reason (the group as a whole contradicts itself).
#
# Every allow carries a reason, and is an `expect`, which goes red when the lint it silences stops
# firing, so no allow outlives its cause.
allow_attributes = "warn"
allow_attributes_without_reason = "forbid"
# A gate or a library never panics on a value it did not check: `unwrap()` becomes `?`, a match, or
# `expect("the invariant")`. In tests `unwrap()` is fine (clippy.toml).
unwrap_used = "warn"
# `panic!` in a library is a refusal that forgot its `Result`; in tests it is the assertion (clippy.toml).
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Output goes through the `Write` a caller hands in (`main(args, out, err)`), so a test reads it and a
# gate's lines are the same whoever prints them; tests may print (clippy.toml).
print_stdout = "warn"
print_stderr = "warn"
# A process ends by returning its `ExitCode` from `main`, never from inside a library.
exit = "warn"
# Every `unsafe` block states why it is sound, one operation per block, and nothing says SAFETY where
# nothing is unsafe.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Iterating a hash map or set is in no order; what reaches an output or a decision is sorted first, or
# is a `BTreeMap` (AGENTS.md, "Determinism", rule 4).
iter_over_hash_type = "warn"
# `&text[a..b]` panics inside a multi-byte character; a parser takes bytes or `get`.
string_slice = "warn"
# `map_err(|_| ...)` throws away what went wrong; the cause stays in the message.
map_err_ignore = "warn"
# `.ok()` written to silence a `Result` still drops its error; write `let _ = ...` to say so.
unused_result_ok = "warn"
# A module is `name.rs` beside `name/`, never `name/mod.rs`.
mod_module_files = "warn"
# A test is a sentence, not `test_a_sentence`.
redundant_test_prefix = "warn"
# A float literal the type cannot hold exactly is a number the reader did not mean.
lossy_float_literal = "warn"
# A file read in one call is `fs::read_to_string`, not a `File` and a buffer.
verbose_file_reads = "warn"
# A fn pointer cast to a number, `mem::forget`, `Rc<Vec>` and a method that shadows a trait's are
# mistakes clippy only reports on request.
fn_to_numeric_cast_any = "warn"
mem_forget = "warn"
rc_buffer = "warn"
same_name_method = "warn"
# `Struct { a, .. }` where every field is named hides a field added later.
rest_pat_in_fully_bound_structs = "warn"
# An `include_bytes!` over a megabyte belongs in a file read at run time.
large_include_file = "warn"
# From the cargo group: a dependency's version is always pinned to a major, and a feature is named for
# what it adds.
wildcard_dependencies = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
