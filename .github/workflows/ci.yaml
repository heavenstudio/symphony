name: Symphony CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      SF_CHROME: google-chrome
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: extractions/setup-just@v2
      - name: Native fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lsof pkg-config clang cmake
          sudo install -d -m 1777 /private/tmp
          google-chrome --version
      - name: Pinned Rust and browser target
        run: rustup show
      - name: Format, host and wasm clippy, real client drift, native and headless browser tests
        run: just verify
