# How clippy reads the workspace lints (Cargo.toml, `[workspace.lints.clippy]`). Only what differs from
# clippy's defaults is here.

# A lint may ask for a change to a `pub` signature. Not every caller is in this tree: consuming
# projects pin these packages by git and call a few hundred of their names. Most of those
# signatures are pinned, each coerced to its fn pointer type, by the `tests/consumer_api.rs` guards
# (docs/RELEASES.md, step 4), which this same lint compiles: a signature a guard pins, changed to
# please a lint, fails the gate, and the name keeps its signature under an
# `#[expect(clippy::..., reason = "a consumer calls it")]`. The signature of a function a guard
# names alone, and what no guard names, only the release run's conciliation catches. `true` would
# instead exempt every exported item of every package from the lints this setting governs: some two
# thousand `pub fn`s across the workspace, nearly all of which only this tree calls.
avoid-breaking-exported-api = false

# A test asserts: its `unwrap()` and `panic!` are the assertion, and it may print what it saw.
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Names `doc_markdown` would otherwise want in backticks: the products and formats the docs name as
# words. `..` keeps clippy's own list (JavaScript, GitHub, macOS and the rest).
doc-valid-idents = ["SurrealDB", "SurrealKV", "SQLite", "GDScript", "CBOR", ".."]
