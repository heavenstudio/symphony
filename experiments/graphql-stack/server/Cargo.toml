# What a GraphQL layer costs the Symphony's server: its compile time and its time per query, against
# a plain JSON read of the same data, each on axum 0.8 as the server is. One feature at a time
# (README.md). A workspace of its own: nothing in the Symphony's workspace builds, tests or reads it.
[package]
name = "graphql-stack-server"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Stefano Benatti"]

[workspace]

[features]
rest = []
async-graphql = ["dep:async-graphql", "dep:async-graphql-axum"]
juniper = ["dep:juniper", "dep:juniper_axum"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-graphql = { version = "=7.2.1", optional = true }
async-graphql-axum = { version = "=7.2.1", optional = true }
juniper = { version = "=0.18.0", optional = true }
juniper_axum = { version = "=0.4.0", optional = true }

[profile.release]
codegen-units = 1
