# The most bytes each binary this workspace delivers may weigh, built as `cargo install` builds it
# (the workspace's release profile) for aarch64-apple-darwin, and the most the client distribution
# the server embeds may weigh. `just size-check` builds the binaries and checks every line
# (`symphony-build size-budget`, docs/workflow/CHECKS.md "Size budgets"); the release run's `just verify`
# runs it.
#
# A line is its size plus 4 %, rounded down to a multiple of 10,000 bytes. The commit of a reduction
# sets it, lowering it to that (as `symphony-build size-budget` prints it). A binary past its line is
# taken back under by a reduction first; a line is raised only by its task's orchestrator's decision
# (`just tasks gate SLUG tools/size-budget.toml:NAME --raise NEW`, docs/workflow/TASKS.md "Gate decisions"),
# in a commit of its own that names the growth and why no reduction will do, to the size plus 4 %
# and never higher, on a fresh reviewer's approve (docs/workflow/CHECKS.md, "Where a line stands" and "A red
# at the size check").

# The builds `symphony-build publish-client` keeps under apps/symphony-server/client/public, which
# the server's build script embeds: each build whole, a file two builds share counted for each, and
# index.html and builds.json once (docs/workflow/CHECKS.md "Size budgets"). At c0d5409's distribution that is
# 2,272,465 bytes: builds of 756,886, 754,713 and 755,142 and 5,724 of page; the line is that plus
# 4 %. It replaces 1,530,000, a line on every file once (1,568,481 there), which moved with how many
# files the builds share and not with what they weigh: the builds grew 2,173 bytes, while the
# shared chunk's change renamed 23 of the newest build's 32 files, so no reduction will do.
# The tokens and estimated cost on the pages (app/token-cost-on-pages) make each build 13,976
# bytes larger than main's newest at 8f4ccdede: Reports' Tokens and cost section 5,235
# (reports.js +4,738, reports.css +497), the task page's tokens chunk 3,448 (loaded only when its
# disclosure opens), the cards' cost 1,920 (board.js +1,847, board.css +73), the cost wording the
# board, Agents, Reports and that chunk share 1,392 (a chunk of its own, spend.ts), the task page
# 1,242, Agents 562 and the shared chunk and the shell 180. There the folder is 2,364,681 bytes
# (that build of 798,823 beside main's 784,847 and 774,889, and 6,122 of page), 4,681 past
# 2,360,000, where main's own folder had some 19,300 left. No reduction holds: a cut of 4,681
# would drop a part the task's brief names, and every later build carries the same pages while
# three builds are kept. The line is that size plus 4 %, by the orchestrator's gate decision.
# The landings of 2026-11-22 took the folder past that line together
# (tests/release-red-verify-size-check-10): 2,406,959 at the last green run's f9e9fb427 (builds of
# 800,223, 800,212 and 800,215, and 6,309 of page), 2,473,846 at 2422e906e and on main at
# 7f651be42 (832,908, 830,999 and 803,392, and 6,547 of page). The newest build grew 32,685
# bytes, by file: the workflow guard panel's nextactions chunk 14,126 (app/workflow-guard-panel,
# whose guards.tsx is 11.6 KB of it, and app/workflow-pages-follow-ups 1,112), the Settings page
# 10,393 (settings.js 6,646 and settings.css 3,747, app/settings-page-reads), flow.js 3,153,
# board.js 1,434, docs.js 1,045, the shared chunks 834, the shell 809, board.css 617, and 274 in
# eight other files. No reduction holds: an attribution of every byte of the build by its source
# maps finds no module in two chunks and nothing unminified, and the growth is those two pages
# themselves. The one structural cut, a shared reader for the 549 hand-written wire field checks,
# takes back some 3 to 4 KB a build, where the line holds three builds of 814,484 each and main's
# newest is 18,424 past that; and as three builds are kept, the folder after this landing and the
# next one would be green only with a build of about 775,700, a cut of 59 KB. Measured 2,473,846;
# the line is that plus 4 %, rounded down to 10,000, by the orchestrator's gate decision.
client = 2_570_000

