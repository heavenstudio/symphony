# The most bytes each binary this workspace delivers may weigh, built as `cargo install` builds it
# (the workspace's release profile) for aarch64-apple-darwin, and the most the client distribution
# the server embeds may weigh. `just size-check` builds the binaries and checks every line
# (`symphony-build size-budget`, docs/CHECKS.md "Size budgets"); the release run's `just verify`
# runs it.
#
# A line is its size plus 4 %, rounded down to a multiple of 10,000 bytes. The commit of a reduction
# sets it, lowering it to that (as `symphony-build size-budget` prints it). A binary past its line is
# taken back under by a reduction first; a line is raised only in a commit of its own that names the
# growth and why no reduction will do, to the size plus 4 % and never higher, on a fresh reviewer's
# approve (docs/CHECKS.md, "Where a line stands" and "A red at the size check").

# Every regular file under apps/symphony-server/client/public, as the server's build script embeds
# them: the generations `symphony-build publish-client` keeps.
client = 1_530_000

# Each binary's file; symphony-server's less the client above, which it embeds.
[binaries]
symphony-server = 16_720_000
# Scratch PostgreSQL startup (+33,104 bytes) and main's release-notes/retired-key paths
# (+33,056) each fit the former symphony line alone; together they weigh 11,914,192.
# The combined line is that size plus 4%, rounded down to 10,000; independent review is required.
symphony = 12_390_000
# PostgreSQL board selection and lifecycle add 66,176 bytes to tasks and 49,632 to agent-send.
# agent-send links no snapshot/recovery command body. Canonical four-binary
# measurement: 6,479,680 / 3,037,536 bytes; each line is that plus 4%, rounded down to 10,000.
# Reader-only migration separation and shared I/O construction were measured first; see the
# lifecycle task's link maps and reduction evidence. No profile or dependency changed.
tasks = 6_730_000
agent-send = 3_150_000
