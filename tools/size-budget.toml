# The most bytes each binary this workspace ships may weigh, built as `cargo install` builds it
# (the workspace's release profile) for aarch64-apple-darwin, and the most the client distribution
# the server embeds may weigh. `just size-check` builds the binaries and checks every line
# (`symphony size-budget`, docs/CHECKS.md "Size budgets"); the release run's `just verify` runs it.
#
# A line is its size plus 4 %, rounded down to a multiple of 10,000 bytes, set only in the commit of
# a reduction, which lowers it to that (as `symphony size-budget` prints it) and never raises it. A
# binary past its line is taken back under by a reduction, never by a higher line (docs/CHECKS.md,
# "Where a line stands" and "A red at the size check").

# Every regular file under apps/symphony-server/client/public, as the server's build script embeds
# them: the generations `symphony publish-client` keeps.
client = 20_750_000

# Each binary's file; symphony-server's less the client above, which it embeds.
[binaries]
symphony-server = 18_570_000
symphony = 18_000_000
tasks = 24_700_000
agent-send = 5_250_000
